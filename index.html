<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1012">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>LiftLog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8541e'/%3E%3Crect x='6' y='14' width='20' height='4' rx='1' fill='white'/%3E%3Crect x='5' y='9' width='5' height='14' rx='1.5' fill='white'/%3E%3Crect x='22' y='9' width='5' height='14' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #0f1012;
  --surface: #18191c;
  --surface-2: #222328;
  --ink: #f2f2ef;
  --ink-2: #b6b9bf;
  --muted: #82868d;
  --line: #2a2c31;
  --accent: #ff7a45;
  --accent-soft: #3a2117;
  --on-accent: #1a0d07;
  --good: #4cc786;
  --good-soft: #15291e;
  --danger: #ff6b5e;
  --fig: #ececea;
  --fig-far: #5b5f66;
  --eq: #6a6f77;
  --shadow: none;
  --hm-sil: #26282d;
  --hm-0: #3b3e45;
  --hm-1: #5e3424;
  --hm-2: #b0532c;
  --hm-3: #ff7a45;
  --r: 16px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
body.has-sheet { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.muted { color: var(--muted); font-weight: 400; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app { max-width: 600px; margin: 0 auto; padding: 0 16px 24px; }

.top { padding: 28px 0 12px; }
.top.row { display: flex; align-items: center; gap: 12px; }
.wo-head { justify-content: space-between; }
.eyebrow { margin: 0 0 4px; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: .95rem; }
.sub.pad { margin: 0 0 14px; }
.note { color: var(--muted); font-size: .82rem; margin: 10px 0 0; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }

/* buttons */
.btn {
  border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 650;
  background: var(--surface-2); color: var(--ink); transition: transform .08s, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.small { padding: 8px 14px; font-size: .9rem; border-radius: 10px; }
.btn.block { width: 100%; display: block; }
.btn.danger, .link.danger { color: var(--danger); }
.btn.add { margin-top: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 12px; font-size: 1.4rem; line-height: 1; flex: none; }
.link { border: 0; background: none; padding: 8px 4px; color: var(--accent); font-weight: 600; font-size: .92rem; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: .85rem; font-weight: 600; white-space: nowrap;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.ghost { color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.cta-bar {
  position: sticky; bottom: calc(72px + env(safe-area-inset-bottom)); padding: 14px 0 4px;
  background: linear-gradient(to bottom, transparent, var(--bg) 30%);
  display: grid; gap: 8px; margin-top: 8px;
}

.card { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

/* figures */
.fig { width: 100%; height: 100%; display: block; overflow: visible; }
.fig line { stroke-linecap: round; }
.f-floor { stroke: var(--line); stroke-width: 2; }
.f-eq { stroke: var(--eq); opacity: .55; }
.f-limb { stroke: var(--fig); stroke-width: 6; }
.f-far { stroke: var(--fig-far); stroke-width: 6; }
.f-body { stroke: var(--fig); }
.f-head { fill: var(--fig); }
.f-joint { fill: var(--fig); }
.f-wt { fill: var(--accent); }
.f-plate { fill: none; stroke: var(--accent); stroke-width: 3.5; }
.f-bar { stroke: var(--accent); }
.f-cable { stroke: var(--eq); stroke-dasharray: 3 3; }
.f-pulley { fill: none; stroke: var(--eq); stroke-width: 2; }
.f-ghost { opacity: .25; }

/* muscle groups */
.group-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.group {
  position: relative; text-align: left; border: 2px solid transparent; background: var(--surface);
  border-radius: var(--r); padding: 10px 14px 14px; box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto auto auto auto; transition: border-color .15s, transform .08s;
}
.group:active { transform: scale(.98); }
.group.on { border-color: var(--accent); background: var(--accent-soft); }
.g-fig { width: 76px; height: 76px; margin: 0 0 4px -6px; display: block; }
.g-name { font-weight: 700; font-size: 1.05rem; }
.g-meta { font-size: .8rem; color: var(--muted); }
.g-status { font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 1px; }
.group.g-ready { border-color: rgba(76, 199, 134, .45); background: var(--good-soft); }
.group.g-ready .g-status { color: var(--good); }
.group.g-rest .g-fig { opacity: .55; }
.group.on { border-color: var(--accent); background: var(--accent-soft); }
.g-key { white-space: nowrap; color: var(--good); font-weight: 600; }
.g-key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--good); margin-right: 5px; }
.g-check {
  position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .85rem; font-weight: 800;
}

/* plan list */
.lift-list { display: grid; gap: 10px; }
.lift-card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); }
.thumb { width: 96px; height: 96px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.lc-body { min-width: 0; }
.lc-body h3 { font-size: 1.02rem; }
.meta { margin: 2px 0 0; color: var(--ink-2); font-size: .85rem; }
.last { margin: 4px 0 0; font-size: .82rem; color: var(--ink-2); }
.last span { font-weight: 700; color: var(--good); margin-right: 4px; }
.last.new { color: var(--muted); }
.lc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* workout */
.dots { list-style: none; padding: 0; margin: 4px 0 14px; display: flex; gap: 6px; }
.dots li { flex: 1; }
.dot { width: 100%; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--line); display: block; }
.dot.ok { background: var(--good); }
.dot.skip { background: var(--muted); opacity: .5; }
.dot.cur { background: var(--accent); }

.ex-card { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 6px 16px; align-items: center; }
.ex-fig { aspect-ratio: 1; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.ex-info h2 { font-size: 1.35rem; }
.howto { grid-column: 1 / -1; margin-top: 8px; }
.howto summary { font-weight: 600; font-size: .9rem; color: var(--accent); cursor: pointer; }
.howto ol { margin: 8px 0 0; padding-left: 20px; font-size: .9rem; color: var(--ink-2); }
.howto li + li { margin-top: 4px; }
@media (max-width: 480px) {
  .ex-card { grid-template-columns: 136px 1fr; }
  .ex-info h2 { font-size: 1.2rem; }
}

.lasttime { background: var(--good-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.lasttime.new { background: var(--surface-2); }
.lt-label { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.lt-sets { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 2px; }
.lt-sets b { font-variant-numeric: tabular-nums; font-size: 1.02rem; }

.sets { display: grid; gap: 6px; }
.set-head, .set-row { display: grid; grid-template-columns: 34px 1fr 76px 64px 46px; gap: 8px; align-items: center; }
.set-head { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 2px; }
.set-head span:nth-child(3), .set-head span:nth-child(4) { text-align: center; }
.set-row { padding: 4px 2px; border-radius: 12px; transition: background .15s; }
.set-row.done { background: var(--good-soft); }
.set-n { font-weight: 700; text-align: center; }
.prev { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.set-row input {
  width: 100%; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2);
  text-align: center; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.set-row input::-webkit-outer-spin-button, .set-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set-row input::placeholder { color: var(--muted); font-weight: 500; }
.set-row input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.set-row.done input { background: transparent; border-color: transparent; }
.check {
  width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: 1.15rem; font-weight: 800; color: var(--muted);
}
.set-row.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.shake { animation: shake .35s; border-color: var(--danger) !important; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.set-tools { display: flex; justify-content: space-between; margin-top: 4px; }

.rest { margin-top: 10px; display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
.rest span { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rest b { font-variant-numeric: tabular-nums; font-size: 1.15rem; min-width: 3ch; }
.rest-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.rest-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s linear; }
.rest.over { background: var(--accent-soft); }
.rest.over b { color: var(--accent); }
.rest .link { padding: 4px; }

.wo-cta { margin: 4px 0 14px; }
.upnext ul { list-style: none; margin: 8px 0; padding: 0; }
.upnext li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 10px 8px; border-radius: 10px; text-align: left; }
.upnext li.cur button { background: var(--surface-2); font-weight: 700; }
.upnext .link + .link { float: right; }

/* summary / tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile span { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.pr { border: 2px solid var(--accent); }
.pr ul, .hist-sets { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.pr li, .hist-sets li { display: grid; }
.pr em { color: var(--muted); font-style: normal; }
.hist-sets span { color: var(--ink-2); font-size: .9rem; font-variant-numeric: tabular-nums; }

/* progress */
.field { display: grid; gap: 4px; margin-top: 12px; font-size: .85rem; color: var(--ink-2); }
.field.row { grid-template-columns: 1fr auto; align-items: center; }
.field select, .field input {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 1rem;
}
.field.row select { width: auto; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin: 10px 0 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.up { color: var(--good); font-weight: 700; }
.down { color: var(--danger); font-weight: 700; }

.chart { position: relative; margin-top: 8px; min-height: 220px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-base { stroke: var(--muted); stroke-width: 1; }
.c-axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.c-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.c-hl { fill: var(--accent); stroke: var(--surface); stroke-width: 3; pointer-events: none; }
.c-cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.c-val { fill: var(--ink); font-size: 12px; font-weight: 700; }
.c-bar { fill: var(--accent); }
.c-empty { color: var(--muted); text-align: center; padding: 80px 0; margin: 0; }
.c-tip {
  position: absolute; display: none; pointer-events: none; background: var(--ink); color: var(--bg);
  padding: 6px 10px; border-radius: 8px; font-size: .8rem; white-space: nowrap; z-index: 2;
}
.c-tip b { display: block; font-size: .95rem; }
.c-tip span { opacity: .8; }
.table-view { margin-top: 10px; font-size: .88rem; }
.table-view summary { color: var(--accent); font-weight: 600; cursor: pointer; }
.table-view table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.table-view th, .table-view td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-view th { color: var(--muted); font-weight: 600; font-size: .78rem; }
.empty-state { text-align: center; padding: 32px 20px; }
.empty-state p { color: var(--ink-2); }

/* history */
.hist { list-style: none; padding: 0; margin: 0; }
.hist-item { padding: 0; }
.hist-head { width: 100%; border: 0; background: none; padding: 14px 16px; display: flex; justify-content: space-between; gap: 8px; text-align: left; align-items: center; }
.hist-head > span:first-child { display: grid; }
.hist-head .muted { font-size: .85rem; }
.hist-item .hist-sets { padding: 0 16px; margin: 0 0 4px; }
.hist-item .link { margin: 4px 12px 10px; }

/* picker sheet */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 600px; max-height: 88vh; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
#pk-q { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.chips-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.pk-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.pk-list button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 8px 12px 8px 8px; }
.pk-list button:disabled { opacity: .45; cursor: default; }
.pk-list b { display: block; }
.pk-list .muted { font-size: .82rem; }
.pk-fig { width: 52px; height: 52px; flex: none; background: var(--surface-2); border-radius: 10px; padding: 2px; }
.custom { margin-top: 14px; background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.custom summary { font-weight: 650; cursor: pointer; }
.custom-form { display: grid; gap: 4px; }
.custom-form .btn { margin-top: 12px; }

/* tabs */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
#tabs button { flex: 1; max-width: 160px; border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px; font-size: .75rem; font-weight: 600; color: var(--muted); border-radius: 10px; }
#tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#tabs button[aria-current="page"] { color: var(--accent); }

#toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.has-undo { display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 16px; }
#toast.has-undo.show { pointer-events: auto; }
#toast button { background: none; border: 0; color: var(--accent-ink, #c2410c); font: inherit; font-weight: 800; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
#toast button:hover { background: rgba(0, 0, 0, .08); }

button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }


/* muscle heatmap */
.hm-wrap { display: flex; gap: 4px; justify-content: center; }
.hm-body { width: 64px; height: auto; display: block; }
.hm-wrap.mini .hm-body { width: 30px; }
.hm-sil { fill: var(--hm-sil); }
.hm { stroke: var(--surface); stroke-width: .7; stroke-linejoin: round; }
.hm-0 { fill: var(--hm-0); } .hm-1 { fill: var(--hm-1); } .hm-2 { fill: var(--hm-2); } .hm-3 { fill: var(--hm-3); }
.hm-lbl { font-size: 15px; fill: var(--muted); text-anchor: middle; font-weight: 600; }
.hm-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); margin-top: 6px; }
.hm-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.works { margin: 4px 0 0; font-size: .8rem; color: var(--ink-2); }
.lc-map { margin-top: 8px; }
.ex-map { margin-top: 10px; }
.ex-map .hm-wrap { justify-content: flex-start; }
.ex-map .hm-body { width: 56px; }
.cov { margin-top: 14px; }
.cov-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cov-head h2 { font-size: 1.1rem; }
.cov-score { font-size: .8rem; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.cov-score.full { background: var(--good-soft); color: var(--good); }
.cov-body { display: grid; grid-template-columns: auto 1fr; gap: 16px; margin-top: 12px; align-items: start; }
.cov-map .hm-body { width: 60px; }
.cov-list h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 4px; }
.cov-list h3:not(:first-child) { margin-top: 12px; }
.cov-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cov-list li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; font-size: .88rem; }
.cv-ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 800; margin-top: 1px; }
.cv-hit .cv-ic { background: var(--good-soft); color: var(--good); }
.cv-light .cv-ic { background: var(--accent-soft); color: var(--accent); }
.cv-miss .cv-ic { background: var(--surface-2); color: var(--danger); }
.cv-state { font-size: .76rem; color: var(--muted); }
.cv-by { display: block; font-size: .78rem; color: var(--ink-2); }
.cv-sug { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; font-size: .78rem; color: var(--ink-2); }
.chip.small { padding: 4px 9px; font-size: .76rem; }
@media (max-width: 420px) {
  .cov-body { grid-template-columns: 1fr; }
  .cov-map .hm-wrap { justify-content: center; }
}
.pk-txt { flex: 1; min-width: 0; }
.pk-fill { display: inline-block; margin-top: 3px; font-size: .74rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
.pk-map { flex: none; }
.pk-note { font-size: .82rem; color: var(--ink-2); padding: 4px 4px 6px; }
.pk-list .pk-note b { display: inline; }
.muted-link { display: block; margin: 6px auto 0; color: var(--muted); font-weight: 500; font-size: .85rem; }
.lasttime.new .lt-label { margin: 0; display: grid; gap: 4px; }
.lasttime.new .sw { font-size: 1.05rem; color: var(--ink); }
.lasttime.new .lt-label span { color: var(--ink-2); font-size: .88rem; }
.prof { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.prof-h { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
.prof label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); min-width: 0; }
.prof input, .prof select { width: 100%; min-width: 0; }
.cal { margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: .88rem; color: var(--muted); }
.cal b { color: var(--accent); }
.gear-card { margin-top: 22px; }
.gear-card h2 { margin: 0; font-size: 1.05rem; }
.gear-list { display: grid; gap: 8px; margin-top: 12px; }
.gear { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.gear > span:last-child { display: grid; gap: 2px; min-width: 0; }
.gear .muted { font-size: .82rem; }
.gear.on { border-color: var(--accent); background: var(--accent-soft); }
.gear-box { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center;
  font-size: .8rem; font-weight: 800; color: var(--on-accent); }
.gear.on .gear-box { background: var(--accent); border-color: var(--accent); }
.pk-no { opacity: .55; }
.xp-btn { margin-top: 8px; }
.xp .sheet-head h2 { margin: 2px 0 0; }
.xp-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px; }
.xp-fig { aspect-ratio: 1; background: var(--surface-2); border-radius: 12px; }
.xp-map .works { margin: 6px 0 0; text-align: center; }
.xp-tip { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: .92rem; line-height: 1.45; }
.xp-tip b { display: block; color: var(--accent); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.xp-sec { margin-top: 16px; }
.xp-sec h3 { margin: 0 0 6px; font-size: .95rem; }
.xp-sec ol, .xp-sec ul { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: .92rem; line-height: 1.45; }
.xp-sec li + li { margin-top: 5px; }
.xp-sec p { margin: 0; color: var(--ink-2); font-size: .92rem; line-height: 1.45; }
.xp-stop { margin-top: 16px; }
.backup-banner { display: grid; gap: 10px; border: 1px solid var(--accent); background: var(--accent-soft); margin-top: 14px; }
.backup-banner b { display: block; }
.backup-banner .muted { font-size: .86rem; }
.backup-banner .btn-row { margin: 0; }
.safety h2 { margin-bottom: 2px; }
.safe-list { list-style: none; margin: 10px 0 12px; padding: 0; display: grid; gap: 10px; }
.safe-list li { display: flex; gap: 10px; align-items: flex-start; }
.safe-list li > span:last-child { display: grid; gap: 3px; min-width: 0; }
.safe-list .muted { font-size: .84rem; line-height: 1.4; }
.safe-list .muted b { color: var(--ink-2); }
.safe-list .btn, .safe-list .link { justify-self: start; margin-top: 4px; }
.s-ico { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 800;
  background: var(--accent-soft); color: var(--accent); }
.safe-list li.ok .s-ico { background: var(--good-soft); color: var(--good); }
.cv-sets { font-size: .74rem; font-weight: 600; text-transform: none; letter-spacing: 0; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.cv-sets.good { background: var(--good-soft); color: var(--good); }
.cv-sets.light, .cv-sets.lots { background: var(--accent-soft); color: var(--accent); }
.time-est { margin: 12px 2px 0; font-size: .88rem; color: var(--ink-2); }
.time-est b { color: var(--ink); }
</style>
</head>

/* ===== figure.js ===== */
/*
 * Animated stick-figure diagrams.
 *
 * Each exercise defines two poses (a = start, b = end). The figure eases
 * between them on a loop. Side view (default) coordinates are in a 200x200 box,
 * the figure faces right, the floor is at y=182.
 *
 * Side-view pose keys
 *   hx, hy        hip position
 *   t             torso lean in degrees from vertical (+ = leaning forward/right)
 *   sTo [x,y]     aim the torso at a point instead of using t
 *   ua, fa        upper-arm / forearm angle, degrees from straight down (+ = forward)
 *   rel           arm angles are relative to the torso
 *   hand [x,y]    hand target (2-bone IK) - or handT [fwd, up] in the torso's frame
 *   ab            elbow bend direction for IK: fwd | back | up | down
 *   th, sh        thigh / shin angle, degrees from straight down
 *   foot [x,y]    foot target (IK), lb = knee bend direction
 *   toe [x,y]     fixed toe point (calf raises)
 *   al            arm length scale (foreshortening)
 *   suffix 2      far-side limb (ua2, hand2, foot2 ...) - defaults to the near side
 *
 * Front view (view: 'front'): hx, hy, ua, fa, th, sh are "outward" angles, shr = shrug,
 *   tf = torso length scale (< 1 = bent over toward the viewer).
 */
(function () {
  const L = { torso: 46, neck: 6, head: 9, ua: 26, fa: 24, th: 32, sh: 32 };
  const R = Math.PI / 180;
  const FLOOR = 182;
  const vec = (a, l) => [Math.sin(a * R) * l, Math.cos(a * R) * l];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const mul = (v, s) => [v[0] * s, v[1] * s];

  function ik(S, T, a, b, bend) {
    const dx = T[0] - S[0], dy = T[1] - S[1];
    let d = Math.hypot(dx, dy) || 0.001;
    const base = Math.atan2(dy, dx);
    d = Math.min(Math.max(d, Math.abs(a - b) + 0.01), a + b - 0.01);
    const al = Math.acos((a * a + d * d - b * b) / (2 * a * d));
    const c1 = [S[0] + a * Math.cos(base + al), S[1] + a * Math.sin(base + al)];
    const c2 = [S[0] + a * Math.cos(base - al), S[1] + a * Math.sin(base - al)];
    const end = [S[0] + d * Math.cos(base), S[1] + d * Math.sin(base)];
    let j;
    if (bend === 'back') j = c1[0] < c2[0] ? c1 : c2;
    else if (bend === 'up') j = c1[1] < c2[1] ? c1 : c2;
    else if (bend === 'down') j = c1[1] > c2[1] ? c1 : c2;
    else j = c1[0] > c2[0] ? c1 : c2;
    return [j, end];
  }

  function lerpPose(a, b, u) {
    const out = {};
    const keys = new Set(Object.keys(a).concat(Object.keys(b)));
    keys.forEach((k) => {
      const va = k in a ? a[k] : b[k];
      const vb = k in b ? b[k] : a[k];
      if (typeof va === 'number' && typeof vb === 'number') out[k] = va + (vb - va) * u;
      else if (Array.isArray(va) && Array.isArray(vb)) out[k] = va.map((x, i) => x + (vb[i] - x) * u);
      else out[k] = u < 0.5 ? va : vb;

  function solveSide(p) {
    const hip = [p.hx ?? 100, p.hy ?? 118];
    let t = p.t || 0;
    if (p.sTo) t = 180 - Math.atan2(p.sTo[0] - hip[0], p.sTo[1] - hip[1]) / R;
    const up = vec(180 - t, 1);
    const fw = [-up[1], up[0]];
    const sh = add(hip, mul(up, L.torso));
    const head = add(sh, mul(up, L.neck + L.head));

    const g = (k, sfx) => (p[k + sfx] !== undefined ? p[k + sfx] : p[k]);

      const e = add(sh, vec((g('ua', sfx) || 0) - off, a));

      const tgt = g('foot', sfx);
      if (tgt) [k, f] = ik(hip, tgt, L.th, L.sh, g('lb', sfx) || 'fwd');
      else {
        k = add(hip, vec(g('th', sfx) || 0, L.th));
        f = add(k, vec(g('sh', sfx) || 0, L.sh));
      }
      let toe = g('toe', sfx);
      if (!toe) {
        const d = [f[0] - k[0], f[1] - k[1]];
        const n = Math.hypot(d[0], d[1]) || 1;

  function solveFront(p) {
    const hip = [p.hx ?? 100, p.hy ?? 118];
    const tf = p.tf ?? 1; // torso foreshortening (bent over, facing the viewer)
    const neck = [hip[0], hip[1] - L.torso * tf];
    const shr = p.shr || 0;
    const sL = [neck[0] - 15, neck[1] + 4 - shr];
    const sR = [neck[0] + 15, neck[1] + 4 - shr];
    const hL = [hip[0] - 8, hip[1]];
    const hR = [hip[0] + 8, hip[1]];
    // bent over toward the viewer: the head drops to about shoulder level
    const head = [neck[0], neck[1] - (L.neck + L.head - 2) * tf + (1 - tf) * 6];
    const out = (a, l, side) => [Math.sin(a * R) * l * side, Math.cos(a * R) * l];
    const arm = (s, side) => {
      const e = add(s, out(p.ua || 0, L.ua, side));
      return [e, add(e, out(p.fa || 0, L.fa, side))];
    };
    const leg = (h, side) => {
      const k = add(h, out(p.th ?? 3, L.th, side));
      const f = add(k, out(p.sh ?? 0, L.sh, side));
      return [k, f, add(f, [6 * side, 0])];

  }

          out += ln([a[0] - 40, y], [b[0] + 40, y], 'f-bar', 3);
          out += `<rect x="${f1(a[0] - 44)}" y="${f1(y - 11)}" width="6" height="22" rx="1.5" class="f-wt"/>`;
          out += `<rect x="${f1(b[0] + 38)}" y="${f1(y - 11)}" width="6" height="22" rx="1.5" class="f-wt"/>`;
        } else {
          const [x, y] = points(s, e.at === 'hip' ? 'hip' : 'hand')[0];
          const dy = e.at === 'hip' ? -9 : 0;
          out += `<circle cx="${f1(x)}" cy="${f1(y + dy)}" r="11" class="f-plate"/>`;
          out += `<circle cx="${f1(x)}" cy="${f1(y + dy)}" r="2.5" class="f-wt"/>`;
        }
      } else if (e.type === 'grip' || e.type === 'cable') {
        points(s, e.type === 'cable' ? e.at || 'hand' : e.at).forEach(([x, y]) => {
          out += `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.5" class="f-wt"/>`;
        });
      } else if (e.type === 'roller') {
        const [x, y] = s.leg[1];
        out += `<circle cx="${f1(x)}" cy="${f1(y - 2)}" r="6" class="f-plate"/>`;
      } else if (e.type === 'footplate') {
        const f = s.leg[1];
        const d = [f[0] - s.hip[0], f[1] - s.hip[1]];
        const n = Math.hypot(d[0], d[1]) || 1;
        const pp = [(-d[1] / n) * 18, (d[0] / n) * 18];
        const o = [(d[0] / n) * 4, (d[1] / n) * 4];
        out += ln(add(add(f, o), pp), add(add(f, o), mul(pp, -1)), 'f-eq', 5);
      }
    });
    return out;
  }

  function drawSide(s, eq) {
    const far = (pts) => pts.map((p) => [p[0] - 4, p[1] - 2]);
    const hip2 = [s.hip[0] - 4, s.hip[1] - 2];
    const sh2 = [s.sh[0] - 4, s.sh[1] - 2];
    const [k2, f2, t2] = far(s.leg2);
    const [e2, h2] = far(s.arm2);
    const [k, f, t] = s.leg;
    const [e, h] = s.arm;
    return (
      dynEquip(s, eq, true) +
      ln(hip2, k2, 'f-far') + ln(k2, f2, 'f-far') + ln(f2, t2, 'f-far', 4) +
      ln(sh2, e2, 'f-far') + ln(e2, h2, 'f-far') +
      ln(s.hip, s.sh, 'f-body', 9) +
      `<circle cx="${f1(s.head[0])}" cy="${f1(s.head[1])}" r="${L.head}" class="f-head"/>` +
      ln(s.hip, k, 'f-limb') + ln(k, f, 'f-limb') + ln(f, t, 'f-limb', 4) +
      ln(s.sh, e, 'f-limb') + ln(e, h, 'f-limb') +
      `<circle cx="${f1(h[0])}" cy="${f1(h[1])}" r="3" class="f-joint"/>` +
      dynEquip(s, eq, false)
    );
  }

  function drawFront(s, eq) {
    const legs = [s.leg, s.leg2].map(([k, f, t], i) => {
      const h = i ? s.hR : s.hL;
      return ln(h, k, 'f-limb') + ln(k, f, 'f-limb') + ln(f, t, 'f-limb', 4);
    }).join('');
    const arms = [s.arm, s.arm2].map(([e, h], i) => {
      const sp = i ? s.sR : s.sL;
      return ln(sp, e, 'f-limb') + ln(e, h, 'f-limb');
    }).join('');
    const mid = [(s.sL[0] + s.sR[0]) / 2, (s.sL[1] + s.sR[1]) / 2];
    return (
      dynEquip(s, eq, true) + legs +
      ln(s.hL, s.hR, 'f-body', 8) + ln(mid, s.hip, 'f-body', 9) + ln(s.sL, s.sR, 'f-body', 8) +
      `<circle cx="${f1(s.head[0])}" cy="${f1(s.head[1])}" r="${L.head}" class="f-head"/>` +
      arms + dynEquip(s, eq, false)
    );
  }

  const GENERIC = { a: { hx: 100, hy: 118, ua: 4, fa: 4, foot: [100, 182], foot2: [96, 182] }, b: { hx: 100, hy: 118, ua: 10, fa: 30, foot: [100, 182], foot2: [96, 182] } };

  function ease(x) { return x * x * (3 - 2 * x); }
  function phase(ms, period) {
    const x = (ms % period) / period;
    if (x < 0.1) return 0;
    if (x < 0.45) return ease((x - 0.1) / 0.35);
    if (x < 0.6) return 1;
    if (x < 0.95) return 1 - ease((x - 0.6) / 0.35);
    return 0;
  }

  function frame(anim, u) {
    const p = lerpPose(anim.a, anim.b, u);
    const s = anim.view === 'front' ? solveFront(p) : solveSide(p);
    return anim.view === 'front' ? drawFront(s, anim.eq) : drawSide(s, anim.eq);
  }

  const live = new Set();
  let raf = null;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function tick(now) {
    live.forEach((f) => {
      if (!f.svg.isConnected) { live.delete(f); return; }
      if (now - f.last < 33) return; // ~30fps is plenty
      f.last = now;
      f.layer.innerHTML = frame(f.anim, phase(now + f.offset, f.anim.period || 2800));
    });
    raf = live.size ? requestAnimationFrame(tick) : null;
  }

  function mount(el, ex, opts = {}) {
    const anim = (ex && ex.anim) || GENERIC;
    el.innerHTML =
      `<svg viewBox="6 6 188 188" class="fig" role="img" aria-label="${(ex && ex.name) || 'Exercise'} movement diagram">` +
      `<line x1="8" y1="${FLOOR + 3}" x2="192" y2="${FLOOR + 3}" class="f-floor"/>` +
      staticEquip(anim.eq) + `<g class="f-layer"></g></svg>`;
    const svg = el.firstChild;
    const layer = svg.querySelector('.f-layer');
    if (opts.static || reduce || !ex || !ex.anim) {
      layer.innerHTML = frame(anim, opts.u ?? (reduce ? 1 : 0));
      if (reduce && ex && ex.anim && !opts.static) {
        // show start position as a ghost so the motion is still readable
        layer.innerHTML = `<g class="f-ghost">${frame(anim, 0)}</g>` + layer.innerHTML;
      }
      return;
    }
    live.add({ svg, layer, anim, last: 0, offset: opts.offset || 0 });
    if (!raf) raf = requestAnimationFrame(tick);
  }

  window.Figure = { mount };
})();

/* ===== store.js ===== */
/* Persistence (localStorage) and workout-history queries. */
(function () {
  const KEY = 'liftlog.v1';
  const DEFAULTS = () => ({ v: 1, units: 'lb', rest: 90, sessions: [], custom: [], active: null });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULTS();
      return Object.assign(DEFAULTS(), JSON.parse(raw));
    } catch (e) {
      return DEFAULTS();
    }
  }
  function save(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* storage full or blocked */ }
  }

  const e1rm = (w, r) => (r > 0 && w > 0 ? (r === 1 ? w : w * (1 + r / 30)) : 0);

  function summarize(sets) {
    let top = 0, best = 0, vol = 0, reps = 0, totalReps = 0;
    sets.forEach((s) => {
      top = Math.max(top, s.w);
      best = Math.max(best, e1rm(s.w, s.r));
      vol += s.w * s.r;
      reps = Math.max(reps, s.r);
      totalReps += s.r;
    });
    return { top, e1rm: best, vol, reps, totalReps };
  }

  const byDate = (a, b) => new Date(a.date) - new Date(b.date);

  function lastEntry(d, exId) {
    const sorted = [...d.sessions].sort(byDate);
    for (let i = sorted.length - 1; i >= 0; i--) {
      const s = sorted[i];
      const e = s.entries.find((x) => x.exId === exId);
      if (e && e.sets.length) return { date: s.date, sets: e.sets };
    }
    return null;
  }

  function series(d, exId) {
    return [...d.sessions].sort(byDate)
      .map((s) => {
        const e = s.entries.find((x) => x.exId === exId);
        return e && e.sets.length ? { date: new Date(s.date), sets: e.sets, ...summarize(e.sets) } : null;
      })
      .filter(Boolean);
  }

  function bestE1rm(d, exId, beforeDate) {
    let b = 0;
    d.sessions.forEach((s) => {
      if (beforeDate && new Date(s.date) >= new Date(beforeDate)) return;
      const e = s.entries.find((x) => x.exId === exId);
      if (e) b = Math.max(b, summarize(e.sets).e1rm);
    });
    return b;
  }

  function sessionVolume(s) {
    return s.entries.reduce((t, e) => t + summarize(e.sets).vol, 0);
  }

  window.Store = { load, save, summarize, lastEntry, series, bestE1rm, sessionVolume, e1rm, byDate };
})();

  <script>
/* ===== chart.js ===== */
/* Small dependency-free SVG charts: line (over time) and bars (weekly). */
(function () {
  const M = { l: 44, r: 14, t: 16, b: 28 };
  const H = 220;
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dlabel = (d) => `${MON[d.getMonth()]} ${d.getDate()}`;
  const num = (n) => (n >= 10000 ? `${Math.round(n / 1000)}k` : n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k` : `${Math.round(n * 10) / 10}`);

  function ticks(min, max, n = 4) {
    if (min === max) { min = min - 1 < 0 && min >= 0 ? 0 : min - 1; max += 1; }
    const raw = (max - min) / n;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
    return out;
  }

  function frame(el) {
    el.classList.add('chart');
    const W = Math.max(260, el.clientWidth || 320);
    return { W, pw: W - M.l - M.r, ph: H - M.t - M.b };
  }

  function grid(yt, y, W) {
    return yt.map((v) =>
      `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}" class="c-grid"/>` +
      `<text x="${M.l - 8}" y="${y(v) + 4}" text-anchor="end" class="c-axis">${num(v)}</text>`).join('');
  }

  function tooltip(el) {
    let tip = el.querySelector('.c-tip');
    if (!tip) { tip = document.createElement('div'); tip.className = 'c-tip'; el.appendChild(tip); }
    return {
      show(x, y, html, W) {
        tip.innerHTML = html;
        tip.style.display = 'block';
        const w = tip.offsetWidth;
        tip.style.left = `${Math.min(Math.max(x - w / 2, 0), W - w)}px`;
        tip.style.top = `${Math.max(y - tip.offsetHeight - 12, 0)}px`;
      },
      hide() { tip.style.display = 'none'; },
    };
  }

  function line(el, pts, opts = {}) {
    const { W, pw, ph } = frame(el);
    if (!pts.length) { el.innerHTML = `<p class="c-empty">${opts.empty || 'No data yet'}</p>`; return; }
    const xs = pts.map((p) => +p.x);
    const ys = pts.map((p) => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs);
    if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
    const yt = ticks(Math.min(...ys), Math.max(...ys));
    const y0 = yt[0], y1 = yt[yt.length - 1];
    const x = (v) => M.l + ((v - x0) / (x1 - x0)) * pw;
    const y = (v) => M.t + ph - ((v - y0) / (y1 - y0 || 1)) * ph;

    const nx = Math.min(pts.length, Math.max(2, Math.floor(pw / 80)));
    const xl = [];
    for (let i = 0; i < nx; i++) xl.push(pts[Math.round((i * (pts.length - 1)) / Math.max(1, nx - 1))]);
    const xlab = [...new Set(xl)].map((p, i, arr) => {
      const anchor = arr.length > 1 && i === 0 ? 'start' : arr.length > 1 && i === arr.length - 1 ? 'end' : 'middle';
      return `<text x="${x(+p.x)}" y="${H - 8}" text-anchor="${anchor}" class="c-axis">${dlabel(p.x)}</text>`;
    }).join('');

    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(+p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
    const last = pts[pts.length - 1];
    const dots = pts.map((p) => `<circle cx="${x(+p.x)}" cy="${y(p.y)}" r="4" class="c-dot"/>`).join('');

    el.innerHTML =
      `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || 'Line chart'}">` +
      grid(yt, y, W) + xlab +
      `<path d="${d}" class="c-line"/>` + dots +
      `<text x="${Math.min(x(+last.x), W - M.r)}" y="${y(last.y) - 10}" text-anchor="end" class="c-val">${num(last.y)}${opts.unit ? ' ' + opts.unit : ''}</text>` +
      `<line class="c-cross" y1="${M.t}" y2="${M.t + ph}" x1="0" x2="0" style="display:none"/>` +
      `<circle class="c-hl" r="6" style="display:none"/>` +
      `<rect x="${M.l}" y="0" width="${pw}" height="${H}" fill="transparent" class="c-hit"/></svg>`;

    const svg = el.querySelector('svg');
    const cross = svg.querySelector('.c-cross');
    const hl = svg.querySelector('.c-hl');
    const tip = tooltip(el);
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const mx = ev.clientX - r.left;
      let bi = 0, bd = Infinity;
      pts.forEach((p, i) => { const dd = Math.abs(x(+p.x) - mx); if (dd < bd) { bd = dd; bi = i; } });
      const p = pts[bi];
      const px = x(+p.x), py = y(p.y);
      cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.display = '';
      hl.setAttribute('cx', px); hl.setAttribute('cy', py); hl.style.display = '';
      tip.show(px, py, `<b>${num(p.y)}${opts.unit ? ' ' + opts.unit : ''}</b><span>${dlabel(p.x)}${p.note ? ' · ' + p.note : ''}</span>`, W);
    };
    const leave = () => { cross.style.display = 'none'; hl.style.display = 'none'; tip.hide(); };
    const hit = svg.querySelector('.c-hit');
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', leave);
  }

  function bars(el, pts, opts = {}) {
    const { W, pw, ph } = frame(el);
    const max = Math.max(...pts.map((p) => p.y), 0);
    if (!pts.length || max === 0) { el.innerHTML = `<p class="c-empty">${opts.empty || 'No data yet'}</p>`; return; }
    const yt = ticks(0, max);
    const y1 = yt[yt.length - 1];
    const y = (v) => M.t + ph - (v / y1) * ph;
    const band = pw / pts.length;
    const bw = Math.min(28, band * 0.7);
    const every = Math.ceil(pts.length / Math.max(2, Math.floor(pw / 64)));

    let body = '';
    pts.forEach((p, i) => {
      const cx = M.l + band * i + band / 2;
      if (p.y > 0) {
        const top = y(p.y), bot = y(0), r = Math.min(4, bot - top), l = cx - bw / 2, rr = cx + bw / 2;
        body += `<path class="c-bar" d="M${l},${bot}V${top + r}Q${l},${top} ${l + r},${top}H${rr - r}Q${rr},${top} ${rr},${top + r}V${bot}Z"/>`;
      }
      if (i % every === 0 || i === pts.length - 1) {
        if (i === pts.length - 1 && i % every !== 0 && (i % every) < every / 2) return;
        body += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="c-axis">${p.label}</text>`;
      }
    });
    const hits = pts.map((p, i) => `<rect x="${M.l + band * i}" y="0" width="${band}" height="${H}" fill="transparent" data-i="${i}"/>`).join('');
    el.innerHTML =
      `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || 'Bar chart'}">` +
      grid(yt, y, W) + `<line x1="${M.l}" x2="${W - M.r}" y1="${y(0)}" y2="${y(0)}" class="c-base"/>` + body +
      `<g class="c-hits">${hits}</g></svg>`;
    const tip = tooltip(el);
    const svg = el.querySelector('svg');
    const show = (ev) => {
      const i = +ev.target.dataset.i;
      if (Number.isNaN(i)) return;
      const p = pts[i];
      const cx = M.l + band * i + band / 2;
      tip.show(cx, y(p.y), `<b>${num(p.y)}${opts.unit ? ' ' + opts.unit : ''}</b><span>${p.tip || p.label}</span>`, W);
    };
    const hide = () => tip.hide();
    svg.querySelector('.c-hits').addEventListener('pointermove', show);
    svg.querySelector('.c-hits').addEventListener('pointerdown', show);
    svg.querySelector('.c-hits').addEventListener('pointerleave', hide);
  }

  window.Charts = { line, bars, dlabel, num };
})();

</script>

/* ===== app.js ===== */
(function () {

  const tabsEl = document.getElementById('tabs');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ui = {

    step: 'groups',       // groups | plan
    groups: [],
    plan: [],
    picker: null,         // { mode, i, g, q }
    progEx: null,
    metric: 'e1rm',
    open: {},             // expanded history items
    rest: null,           // { end, total }
    summary: null,
    justFinishedLift: false,
  };

  // ------------------------------------------------------------ data safety
  // Workouts live in this browser's storage. These helpers make that safer on a phone:
  // install to the Home Screen, ask the browser not to clear it, and nudge backups.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then((v) => { safe.persisted = v; if (ui.tab === 'history') render(); });
  function askPersist() {
    if (!navigator.storage || !navigator.storage.persist || safe.persisted) return;
    navigator.storage.persist().then((v) => { safe.persisted = v; });
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); safe.installEvt = e; if (ui.tab === 'history') render(); });
  window.addEventListener('appinstalled', () => { safe.installEvt = null; askPersist(); toast('LiftLog installed'); });

  function backupDue() {
    if (!D.sessions.length) return false;
    if (D.backupSnooze && Date.now() < D.backupSnooze) return false;
    if (!D.lastBackup) return D.sessions.length >= 2;
    const newer = D.sessions.some((x) => new Date(x.date) > new Date(D.lastBackup));
    return newer && (Date.now() - new Date(D.lastBackup)) / 864e5 >= BACKUP_DAYS;

      ? `<li class="ok"><span class="s-ico">✓</span><span><b>Installed on this device</b><span class="muted">Opens like an app and works with no signal.</span></span></li>`
      : `<li><span class="s-ico">!</span><span><b>Install the app</b><span class="muted">${isIOS
          ? 'In Safari, tap <b>Share</b> (the square with an arrow), then <b>Add to Home Screen</b>. Installed apps aren\'t cleared after 7 days away like Safari websites are. <br><em>The Home Screen app has its own storage, separate from Safari: if you already logged workouts here, tap Back up now first, then Import backup inside the installed app.</em>'
          : safe.installEvt ? 'Adds LiftLog to your home screen, works with no signal and keeps your data safer.'
          : 'In your browser menu (⋮), choose <b>Install app</b> or <b>Add to Home screen</b>.'}</span>
          ${safe.installEvt ? '<button class="btn primary small" data-act="install">Install</button>' : ''}</span></li>`;
    const persistRow = safe.persisted === null ? ''
      : safe.persisted ? `<li class="ok"><span class="s-ico">✓</span><span><b>Protected storage</b><span class="muted">The browser won't clear your data to free up space.</span></span></li>`
      : `<li><span class="s-ico">!</span><span><b>Storage not protected yet</b><span class="muted">The browser could clear it if the phone runs very low on space. ${isIOS ? 'Installing to the Home Screen helps.' : 'Installing usually turns this on.'}</span>
          <button class="link" data-act="persist">Ask the browser to keep it</button></span></li>`;
    const old = D.lastBackup && (Date.now() - new Date(D.lastBackup)) / 864e5 >= BACKUP_DAYS;

  }

  // ---------------------------------------------------------------- helpers
  const allEx = () => EXERCISES.concat(D.custom);
  const getEx = (id) => allEx().find((e) => e.id === id) || { id, name: id, groups: [], equip: '', sets: 3, reps: '8–12', cues: [] };
  const groupName = (id) => (GROUPS.find((g) => g.id === id) || {}).name || id;
  const unit = () => D.units;
  const fmtNum = (n) => (Math.round(n * 100) / 100).toString();
  const setStr = (s, ex) => {
    if (ex && ex.timed) return s.w ? `+${fmtNum(s.w)}×${s.r}s` : `${s.r}s`;
    return `${s.w ? fmtNum(s.w) : 'BW'}×${s.r}`;
  };
  const shortDate = (iso) => Charts.dlabel(new Date(iso));
  const daysAgo = (iso) => {
    const a = new Date(iso); a.setHours(0, 0, 0, 0);
    const b = new Date(); b.setHours(0, 0, 0, 0);
    return Math.round((b - a) / 864e5);
  };
  const agoText = (iso) => {
    const n = daysAgo(iso);
    return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n < 14 ? `${n} days ago` : n < 60 ? `${Math.round(n / 7)} weeks ago` : shortDate(iso);
  };
  const repTarget = (ex) => {
    const m = String(ex.reps || '').match(/\d+/);
    return m ? m[0] : '';
  };
  const uid = () => Math.random().toString(36).slice(2, 10);

  // toast(msg) shows a short message; toast(msg, undoFn) adds an Undo button
  // and stays up longer so there's time to press it.
  function toast(msg, undo) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.toggle('has-undo', !!undo);
    if (undo) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'Undo';
      b.onclick = () => { clearTimeout(t._h); t.classList.remove('show'); undo(); };
      t.appendChild(b);
    }
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 2200);
  }

  // ------------------------------------------------------------- recovery
  // Rest days a muscle group needs before it's ready again. Smaller groups
  // recover in about a day; chest, back and legs take a bit longer.
  // Each group is judged only on its own last workout, so biceps can be ready
  // whether or not you've had a leg day since.
  const REST_DAYS = { chest: 2, back: 2, legs: 2, shoulders: 1, biceps: 1, triceps: 1, core: 1 };
  // A session trained a group if it was one of the day's groups, or the lifts
  // gave it at least 3 hard sets (sets where it's only a helper count half,
  // so 6 sets of bench press counts as a triceps day too).
  function trainedIn(sess, gid) {
    if ((sess.groups || []).includes(gid)) return true;
    const credit = (sess.entries || []).reduce((n, e) => {
      const ex = getEx(e.exId);
      if (!ex || !ex.groups) return n;
      return n + (ex.groups[0] === gid ? e.sets.length : ex.groups.includes(gid) ? e.sets.length / 2 : 0);
    }, 0);
    return credit >= 3;
  }
  function recovery(gid) {
    const s = [...D.sessions].sort(Store.byDate).reverse().find((x) => trainedIn(x, gid));
    if (!s) return { state: 'ready', label: 'Ready', meta: 'Not trained yet' };
    const days = daysAgo(s.date), need = REST_DAYS[gid] || 1;
    const meta = `Last: ${agoText(s.date)}`;
    if (days > need) return { state: 'ready', label: days >= 7 ? 'Due' : 'Ready', meta };
    const left = need + 1 - days;
    return { state: 'rest', label: left === 1 ? 'Ready tomorrow' : `Ready in ${left} days`, meta };
  }

  function lastLine(exId) {
    const l = Store.lastEntry(D, exId);
    if (!l) return '';
    const ex = getEx(exId);
    return `${l.sets.map((s) => setStr(s, ex)).join(', ')} · ${shortDate(l.date)}`;
  }

  // ------------------------------------------------------- starting weights
  // Typical first working weight for a new lifter at the lift's target reps,
  // as a fraction of bodyweight (dumbbells: per hand; cable fly: per side).
  // Deliberately on the light side: set 1 is a test set and the next set adjusts.
  const START = {
    'bench-press': .45, 'incline-bb-press': .38, 'close-grip-bench': .38, 'db-bench': .14, 'incline-db-press': .12,
    'cable-fly': .07, 'machine-chest-press': .38, 'pec-deck': .3,
    'lat-pulldown': .45, 'barbell-row': .4, 'db-row': .17, 'cable-row': .45, 'machine-row': .4, deadlift: .7,
    'straight-arm-pulldown': .2, 'face-pull': .2,
    ohp: .3, 'db-shoulder-press': .1, 'machine-shoulder-press': .3, 'lateral-raise': .035, 'cable-lateral-raise': .03,
    'front-raise': .04, 'rear-delt-fly': .035, 'upright-row': .25, shrug: .2,
    'barbell-curl': .25, 'db-curl': .07, 'hammer-curl': .08, 'preacher-curl': .2, 'cable-curl': .2, 'incline-db-curl': .06, 'concentration-curl': .06,
    'tricep-pushdown': .2, 'skull-crusher': .19, 'db-skull-crusher': .06, 'overhead-extension': .12, 'cable-overhead-extension': .15, kickback: .05,
    'back-squat': .55, 'goblet-squat': .2, rdl: .5, 'db-rdl': .15, 'leg-press': .9, 'walking-lunge': .08, 'bulgarian-split-squat': .06,
    'leg-extension': .3, 'leg-curl': .3, 'hip-thrust': .55, 'calf-raise': .15, 'cable-crunch': .35, 'db-pullover': .12, 'db-bent-row': .14,
  };
  // Lifts done with a full Olympic bar start at the empty bar at the lightest.
  const FULL_BAR = new Set(['bench-press', 'incline-bb-press', 'close-grip-bench', 'barbell-row', 'deadlift', 'ohp', 'back-squat', 'rdl', 'hip-thrust']);
  const EXP = { new: { k: 1, name: 'New (under 6 months)' }, some: { k: 1.6, name: 'Some (6 months – 2 years)' }, exp: { k: 2.3, name: 'Experienced (2+ years)' } };
  const ASSISTED = { 'pull-up': 1, 'chin-up': 1, 'chest-dip': 1 };

  const repMid = (ex) => {
    const n = String(ex.reps || '').match(/\d+/g);
    return n ? Math.round(n.length > 1 ? (+n[0] + +n[1]) / 2 : +n[0]) : 10;
  };
  const repRange = (ex) => {
    const n = String(ex.reps || '').match(/\d+/g);
    return n ? [+n[0], +(n[1] || n[0])] : [8, 12];
  };
  const isKg = () => D.units === 'kg';
  function step(ex) {
    if (ex.equip === 'Dumbbell') return isKg() ? 2 : 5;
    return isKg() ? 2.5 : 5;
  }
  function floorW(ex) {
    if (FULL_BAR.has(ex.id)) return isKg() ? 20 : 45;
    if (ex.equip === 'Barbell') return isKg() ? 10 : 20; // EZ / fixed bar
    return step(ex);
  }
  // round down to what the gym actually has, never below the lightest option
  const roundW = (w, ex) => Math.max(floorW(ex), Math.floor(w / step(ex) + 0.25) * step(ex));

  function profileBw() {
    const pr = D.profile;
    if (!pr || !(pr.bw > 0)) return 0;
    if (!pr.unit || pr.unit === D.units) return pr.bw;
    return pr.unit === 'kg' ? pr.bw * 2.2046 : pr.bw / 2.2046;
  }

  // Estimate a first working weight for a lift with no history.
  // 1) scale from lifts you've already logged (similar muscles count most),
  // 2) else bodyweight × experience, 3) else a cautious default bodyweight.
  function startWeight(exId) {
    const ex = getEx(exId);
    if (ex.bw || ex.timed) return { bw: true, assisted: !!ASSISTED[ex.id] };
    const r = START[ex.id];
    if (!r) return null;
    let sum = 0, wsum = 0, ref = null, refW = 0;
    Object.keys(START).forEach((id) => {
      if (id === ex.id) return;
      const l = Store.lastEntry(D, id);
      if (!l) return;
      const o = getEx(id);
      const best = Math.max(...l.sets.map((x) => Store.e1rm(x.w, x.r)));
      if (!(best > 0)) return;
      const k = best / (1 + repMid(o) / 30) / START[id]; // your "strength scale" from that lift
      const wt = 0.15 + similarity(ex, o) + (o.equip === ex.equip ? 0.1 : 0);
      sum += k * wt; wsum += wt;
      if (wt > refW) { refW = wt; ref = o; }
    });
    if (wsum) return { w: roundW((sum / wsum) * r * 0.9, ex), from: 'lifts', ref };
    const bw = profileBw();
    const exp = (D.profile && EXP[D.profile.exp]) || EXP.new;
    if (bw) return { w: roundW(bw * r * exp.k, ex), from: 'profile' };
    return { w: roundW((isKg() ? 70 : 155) * r, ex), from: 'default' };
  }

  // After a test set on a new lift: suggest the next set's weight from the reps you got.
  function calibrate(ex, set) {
    const [lo, hi] = repRange(ex);
    const w = +set.w, r = +set.r;
    if (!(w > 0) || !(r > 0)) return null;
    if (r >= hi + 3) return { w: Math.max(roundW(w * 1.15, ex), w + step(ex)), why: `${r} reps was easy, go up` };
    if (r > hi) return { w: w + step(ex), why: `${r} reps is above ${hi}, go up a little` };
    if (r < lo) return { w: Math.max(floorW(ex), Math.min(roundW(w * 0.88, ex), w - step(ex))), why: `${r} reps is under ${lo}, go down` };
    return { w, why: `${r} reps is right in range, stay here` };
  }

  function startText(est, ex) {
    if (!est) return `First time logging this lift. Pick a weight you can do for ${esc(ex.reps || 'your target reps')} with good form.`;
    if (est.bw) {
      return `First time: start with just your bodyweight (leave +${unit()} at 0).`
        + (est.assisted ? ' Can\'t get 5 reps? Use an assist machine or band, or do slow lowering-only reps.' : '');
    }
    const src = est.from === 'lifts' ? `Based on your ${esc(est.ref.name)}.`
      : est.from === 'profile' ? 'Based on your bodyweight and experience.'
      : 'Rough guess for a new lifter.';
    return `<b class="sw">Try ${fmtNum(est.w)} ${unit()}${ex.equip === 'Dumbbell' && !/goblet|overhead-extension|calf|pullover/.test(ex.id) ? ' each hand' : ''} for ${esc(ex.reps)} reps</b>
      <span>${src} Use set 1 as a test: you should finish with 1–2 reps left in the tank. The next set adjusts to how it went.</span>`;
  }

  function profileForm() {
    const pr = D.profile || {};
    return `<div class="prof">
      <span class="prof-h">${pr.bw ? 'Your details (also in History › Settings)' : 'Add these for a better starting weight'}</span>
      <label><span>Bodyweight (${unit()})</span><input id="prof-bw" type="number" inputmode="decimal" min="0" step="any" value="${pr.bw ? fmtNum(profileBw()) : ''}" placeholder="e.g. ${isKg() ? 75 : 165}"></label>
      <label><span>Lifting experience</span><select id="prof-exp">${Object.keys(EXP).map((k) => `<option value="${k}" ${(pr.exp || 'new') === k ? 'selected' : ''}>${EXP[k].name}</option>`).join('')}</select></label>
    </div>`;
  }

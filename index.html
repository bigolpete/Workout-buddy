    'mountain-climber': [['Hips bouncing up and down', 'Hands ahead of your shoulders', 'Sloppy speed'], 'Keep your shoulders over your hands and your hips level, like a moving plank.'],
  };
  const isCompound = (ex) => FULL_BAR.has(ex.id) || Object.values(Muscles.of(ex)).filter((v) => v >= 1).length >= 2 || Object.values(Muscles.of(ex)).filter((v) => v >= .5).length >= 4;

  // ------------------------------------------------------------ time estimate
  // Rough length of a workout: each set (about 4 s per rep, or the hold time, plus
  // ~15 s to set up), your rest timer between sets, ~1 min moving to the next lift,
  // and ~2.5 min of warm-up sets before a loaded compound lift.
  function liftSecs(ex, setsLeft = ex.sets || 3, fresh = true) {
    if (setsLeft <= 0) return 0;
    const rest = D.rest || 90;
    const work = (ex.timed ? repMid(ex) : repMid(ex) * 4) + 15;
    const warm = fresh && !ex.bw && !ex.timed && isCompound(ex) ? 150 : 0;
    return setsLeft * work + (setsLeft - 1) * rest + 60 + warm;
  }
  const planSecs = (ids) => ids.reduce((t, id) => t + liftSecs(getEx(id)), 0);
  const woLeftSecs = (A) => A.items.reduce((t, it) => (it.skipped ? t
    : t + liftSecs(getEx(it.exId), it.sets.filter((x) => !x.done).length, !it.sets.some((x) => x.done))), 0);
  function durText(sec) {
    const m = Math.max(5, Math.round(sec / 300) * 5);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`;
  }

  function explainView() {
    const ex = getEx(ui.explain);
    const g = GUIDE[ex.id];
    const [lo, hi] = repRange(ex);
    const comp = isCompound(ex);
    const heavy = FULL_BAR.has(ex.id);
    const breath = ex.timed ? 'Breathe steadily through your nose and mouth. Don\'t hold your breath. Brace as if someone is about to poke your stomach.'
      : heavy ? 'Take a big breath into your belly and brace before each rep. Hold it through the hard part and breathe out at the top. This bracing protects your back.'
      : 'Breathe in as you lower, and out as you push or pull through the hardest part. Keep your core lightly braced.';
    const tempo = ex.timed ? null : 'Lower under control for about 2–3 seconds, pause briefly, then lift in about 1 second. No bouncing, no swinging.';
    const rest = comp ? '2–3 minutes' : '60–90 seconds';
    const prog = ex.timed ? 'Add 5–10 seconds per set each week. When a full minute feels easy, make it harder (for example, lift one foot).'
      : ex.bw ? `Add reps until you get ${hi} on every set, then make it harder: slow the lowering, add a pause, or hold a weight.`
      : `When you get ${hi} reps on every set with good form, add the smallest step (${step(ex)} ${unit()}) next time. Your reps will drop toward ${lo}; build back up and repeat.`;
    const sec = (t, body) => body ? `<section class="xp-sec"><h3>${t}</h3>${body}</section>` : '';
    const ul = (a) => `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    return `<div class="sheet-backdrop" data-act="close-explain-bg">
      <div class="sheet xp" role="dialog" aria-modal="true" aria-labelledby="xp-title">
        <header class="sheet-head"><div><p class="eyebrow">How to do it well</p><h2 id="xp-title">${esc(ex.name)}</h2></div>
          <button class="icon-btn" data-act="close-explain" aria-label="Close">✕</button></header>
        <div class="xp-top">
          <div class="xp-fig" data-fig="${esc(ex.id)}"></div>
          <div class="xp-map">${Muscles.map(Muscles.of(ex))}<p class="works">${esc(worksText(ex, 4))}</p></div>
        </div>
        ${g ? `<p class="xp-tip"><b>Key tip</b> ${esc(g[1])}</p>` : ''}
        ${sec('Step by step', ex.cues && ex.cues.length ? `<ol>${ex.cues.map((c) => `<li>${esc(c)}</li>`).join('')}</ol>` : '')}
        ${sec('Common mistakes', g ? ul(g[0]) : '')}
        ${sec('Sets, reps and effort', ul([
          `${ex.sets || 3} sets of ${ex.reps || '8–12'}${ex.timed ? '' : ' reps'}, resting ${rest} between sets.`,
          ex.timed ? 'Stop the set when your form starts to slip, not when the timer says so.' : 'End each set with 1–3 reps left in the tank: you could do a couple more with good form, but not many.',
          comp && !ex.bw ? 'Warm up with 1–2 lighter sets (about half, then three-quarters of your working weight) before your first real set.' : 'One easy warm-up set is enough if the muscle is already warm.',
        ]))}
        ${sec('Breathing and speed', ul([breath].concat(tempo ? [tempo] : [])))}
        ${sec('How to progress', `<p>${esc(prog)}</p>`)}
        <p class="note xp-stop">Stop if you feel sharp or joint pain (as opposed to muscle burn). Lighten the weight or swap to a similar lift.</p>
      </div></div>`;
  }

  // -------------------------------------------------------------- equipment
  // Adjustable dumbbells, a bench and your bodyweight are always assumed.
  // Everything else depends on where you are today.
  const GEAR = {
    free: { name: 'Free weight room', hint: 'Barbells, racks, pull-up and dip bars' },
    cable: { name: 'Cable machines', hint: 'Pulleys with ropes and handles' },
    machine: { name: 'Machines', hint: 'Leg press, chest press, rows and more' },
  };
  const BAR_LIFTS = new Set(['pull-up', 'chin-up', 'chest-dip', 'hanging-leg-raise']);
  const gearOf = (e) => (e.equip === 'Barbell' || BAR_LIFTS.has(e.id) ? 'free' : e.equip === 'Cable' ? 'cable' : e.equip === 'Machine' ? 'machine' : null);
  const gear = () => D.gear || { free: true, cable: true, machine: true };
  const canDo = (e) => { const g = gearOf(e); return !g || !!gear()[g]; };
  const availEx = () => allEx().filter(canDo);

  function gearCard() {
    const g = gear();
    return `<section class="gear-card">
      <h2>Today's equipment</h2>
      <p class="sub">Adjustable dumbbells and a bench are always assumed. What else do you have?</p>
      <div class="gear-list">${Object.keys(GEAR).map((k) => `<button class="gear${g[k] ? ' on' : ''}" data-act="toggle-gear" data-k="${k}" aria-pressed="${!!g[k]}">
        <span class="gear-box" aria-hidden="true">${g[k] ? '✓' : ''}</span>
        <span><b>${GEAR[k].name}</b><span class="muted">${GEAR[k].hint}</span></span></button>`).join('')}</div>
    </section>`;
  }

  // ------------------------------------------------------------- plan logic


  // How much a lift adds to areas that aren't yet fully worked (each area counts up to 1).
  function gain(baseIds, exId, areas) {
    const cur = Muscles.total(baseIds.map(getEx));
    const next = Muscles.total(baseIds.concat(exId).map(getEx));
    return areas.reduce((g, a) => g + Math.min(1, next[a] || 0) - Math.min(1, cur[a] || 0), 0);
  }
  const areasFor = (groups) => [].concat(...groups.map((g) => Muscles.GROUP_AREAS[g] || []));
  const exIndex = (id) => { const i = allEx().findIndex((e) => e.id === id); return i < 0 ? 1e9 : i; };

  // How many lifts each group gets. Every lift is 3 sets, so 3 lifts is ~9 hard sets
  // and 4 lifts is ~12: the useful range for one muscle in one workout (past ~12-15
  // you're mostly adding fatigue, not growth). One group: 4 lifts. Two groups: 4 for a
  // big group (chest, back, legs), 3 for a small one. Three or more: 3 each, so adding
  // a group adds lifts instead of thinning out the others.
  // These are starting points, not limits: a group gets one more if it still has a
  // part that nothing works, and you can always add more yourself.
  const BIG_GROUPS = new Set(['chest', 'back', 'legs']);
  function liftTarget(g, n) {
    if (n >= 3) return 3;
    if (n === 2) return BIG_GROUPS.has(g) ? 4 : 3;
    return 4;
  }

  // Take turns across groups, each time choosing the lift that covers the most of
  // that group's areas not already covered, until every group has its share.
  function buildPlan(groups) {
    const ok = availEx().filter((e) => !e.custom);
    const pools = groups.map((g) => {
      const main = ok.filter((e) => e.groups[0] === g);
      // short on equipment: borrow lifts that work this group as a secondary target
      return (main.length >= 4 ? main : main.concat(ok.filter((e) => e.groups[0] !== g && e.groups.includes(g)))).map((e) => e.id);
    });
    const want = groups.map((g) => liftTarget(g, groups.length));
    const got = groups.map(() => 0);
    const plan = [];
    const pick = (gi) => {
      const p = pools[gi].filter((id) => !plan.includes(id));
      if (!p.length) return -1;
      const areas = Muscles.GROUP_AREAS[groups[gi]] || [];
      let best = p[0], bs = -1;
      p.forEach((id) => { const g = gain(plan, id, areas); if (g > bs + 1e-9) { bs = g; best = id; } });
      return { id: best, gain: bs };
    };
    for (let round = 0; got.some((n, gi) => n < want[gi]) && round < 20; round++) {
      groups.forEach((g, gi) => {
        if (got[gi] >= want[gi]) return;
        const b = pick(gi);
        if (b === -1) { want[gi] = got[gi]; return; }
        plan.push(b.id); got[gi]++;
      });
    }
    // one extra lift for a group that still has a part with no real work on it
    groups.forEach((g, gi) => {
      const cur = Muscles.total(plan.map(getEx));
      if (!(Muscles.GROUP_AREAS[g] || []).some((a) => (cur[a] || 0) < .5)) return;
      const b = pick(gi);
      if (b !== -1 && b.gain >= .5) plan.push(b.id);
    });
    return plan.sort((a, b) => exIndex(a) - exIndex(b));
  }

  // Swap: replace a lift with the one that works the most similar muscles,
  // preferring different equipment (the usual reason to swap is "I don't have that").
  // Each lift remembers the chain of lifts swapped away to reach it, so pressing
  // Swap again moves on to the next-best option and avoids equipment already passed over.
  const swapChain = {};
  function similarity(a, b) {
    const va = Muscles.of(a), vb = Muscles.of(b);
    let dot = 0, na = 0, nb = 0;
    Object.keys(va).forEach((k) => { na += va[k] * va[k]; dot += va[k] * (vb[k] || 0); });
    Object.keys(vb).forEach((k) => { nb += vb[k] * vb[k]; });
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }
  function nextAlt(currentId, taken) {
    const chain = [...(swapChain[currentId] || []), currentId];
    const origin = getEx(chain[0]);
    const ov = Muscles.of(origin);
    const main = Object.keys(ov).filter((a) => ov[a] >= 1);
    const avoidEquip = new Set(chain.map((id) => getEx(id).equip));
    // must work the same main muscle (or be from the same group and closely matched)
    const fits = (e) => {
      const v = Muscles.of(e);
      const sameMain = main.some((a) => (v[a] || 0) >= 1);
      const sim = similarity(origin, e);
      return sameMain ? sim > 0.4 : e.groups[0] === origin.groups[0] && sim > 0.6;
    };
    const score = (e) => similarity(origin, e) + (e.groups[0] === origin.groups[0] ? 0.2 : 0) + (avoidEquip.has(e.equip) ? -0.15 : 0.05);
    const open = (e) => e.id !== currentId && !taken.includes(e.id) && fits(e) && (canDo(e) || e.id === origin.id);
    let cands = allEx().filter((e) => open(e) && !chain.includes(e.id));
    if (!cands.length) {
      // every close match has been offered: cycle back round, starting with the original
      cands = allEx().filter(open);
      cands.sort((x, y) => (canDo(y) - canDo(x)) || (y.id === origin.id) - (x.id === origin.id) || score(y) - score(x));
      if (!cands.length) return null;
      const best = cands[0].id;
      if (best !== origin.id) swapChain[best] = [origin.id];
      return best;
    }
    cands.sort((x, y) => score(y) - score(x));
    const best = cands[0].id;
    swapChain[best] = chain;
    return best;
  }
  // Undo puts the old lift back, as long as nothing has changed that slot since.
  function planSwapped(i, from, to, verb = 'Swapped to') {
    toast(`${verb} ${getEx(to).name}`, () => {
      if (ui.plan[i] !== to) return;
      ui.plan[i] = from;
      toast(`Back to ${getEx(from).name}`);
      render();
    });
  }
  function woSwapped(idx, oldItem, newIt, verb = 'Swapped to') {
    const A = D.active;
    toast(`${verb} ${getEx(newIt.exId).name}`, () => {
      if (D.active !== A || A.items[idx] !== newIt || newIt.sets.some((x) => x.done)) { toast('Can\'t undo: sets already logged'); return; }
      A.items[idx] = oldItem;
      A.idx = idx;
      ui.rest = null;
      toast(`Back to ${getEx(oldItem.exId).name}`);
      save(); render();
    });
  }

  // Per-area coverage of the selected groups for a list of lifts.
  function coverage(ids, groups) {
    const cur = Muscles.total(ids.map(getEx));
    return groups.filter((g) => Muscles.GROUP_AREAS[g]).map((g) => ({
      g,
      areas: Muscles.GROUP_AREAS[g].map((a) => {
        const v = cur[a] || 0;
        const by = ids.filter((id) => (Muscles.of(getEx(id))[a] || 0) >= .5)
          .sort((x, y) => (Muscles.of(getEx(y))[a] || 0) - (Muscles.of(getEx(x))[a] || 0));
        return { a, v, by, state: v >= 1 ? 'hit' : v >= .5 ? 'light' : 'miss' };
      }),
    }));
  }

  // Best lifts to fill an area, favouring the day's muscle groups.
  function suggestFor(area, taken, groups) {
    return availEx().filter((e) => !taken.includes(e.id) && (Muscles.of(e)[area] || 0) >= 1)
      .sort((x, y) => (groups.includes(y.groups[0]) ? 1 : 0) - (groups.includes(x.groups[0]) ? 1 : 0))
      .slice(0, 2);
  }

  const worksText = (ex, n = 3) => Muscles.list(Muscles.of(ex)).slice(0, n).map((a) => Muscles.AREAS[a]).join(' · ');

  // Hard sets a group gets today: full credit when it's the lift's main group, half otherwise.
  function groupSets(ids, g) {
    return ids.reduce((n, id) => { const e = getEx(id), k = e.sets || 3; return n + (e.groups[0] === g ? k : (e.groups || []).includes(g) ? k / 2 : 0); }, 0);
  }
  function setsBadge(ids, g) {
    const n = Math.round(groupSets(ids, g));
    const [cls, txt] = n < 6 ? ['light', 'on the light side'] : n <= 15 ? ['good', 'a solid amount'] : ['lots', 'a lot for one day'];
    return `<span class="cv-sets ${cls}" title="About 6–12 hard sets per muscle in one workout is the useful range. Sets from lifts where it's a helper muscle count half.">${n} sets · ${txt}</span>`;
  }

  function coverageCard(ids, groups) {
    const cov = coverage(ids, groups);
    if (!cov.length) return '';
    const all = [].concat(...cov.map((c) => c.areas));
    const hit = all.filter((x) => x.state === 'hit').length;
    const gaps = all.filter((x) => x.state !== 'hit');
    const icon = { hit: '✓', light: '◐', miss: '✕' };
    const word = { hit: 'Worked', light: 'A little', miss: 'Missed' };
    const vals = Muscles.total(ids.map(getEx));
    const gname = esc(groups.map(groupName).join(' + ').toLowerCase());
    return `<section class="card cov">
      <div class="cov-head"><h2>Muscle coverage</h2><span class="cov-score${gaps.length ? '' : ' full'}">${hit} of ${all.length} areas</span></div>
      <p class="sub">${gaps.length
        ? `To work all of ${gname}, add or swap in a lift for the ${gaps.length === 1 ? 'area' : 'areas'} not checked off below.`
        : `Nice balance: every part of ${gname} gets direct work today.`}</p>
      <div class="cov-body">
        <div class="cov-map">${Muscles.map(vals)}
          <div class="hm-key"><span><i style="background:var(--hm-3)"></i>Main</span><span><i style="background:var(--hm-2)"></i>Some</span><span><i style="background:var(--hm-1)"></i>Light</span></div></div>
        <div class="cov-list">${cov.map((c) => `
          <h3>${esc(groupName(c.g))} ${setsBadge(ids, c.g)}</h3>
          <ul>${c.areas.map((x) => {
            const sug = x.state === 'hit' ? [] : suggestFor(x.a, ids, groups);
            return `<li class="cv-${x.state}"><span class="cv-ic" aria-hidden="true">${icon[x.state]}</span>
              <span class="cv-txt"><b>${esc(Muscles.AREAS[x.a])}</b> <span class="cv-state">${word[x.state]}</span>
              ${x.by.length ? `<span class="cv-by">${esc(x.by.slice(0, 2).map((id) => getEx(id).name).join(', '))}</span>` : ''}
              ${sug.length ? `<span class="cv-sug">Try ${sug.map((e) => `<button class="chip small" data-act="cov-add" data-id="${esc(e.id)}">+ ${esc(e.name)}</button>`).join(' ')}</span>` : ''}</span></li>`;
          }).join('')}</ul>`).join('')}
        </div>
      </div>
    </section>`;
  }

  const newItem = (exId) => ({ exId, sets: Array.from({ length: getEx(exId).sets || 3 }, () => ({ w: '', r: '', done: false })), skipped: false });
  const itemDone = (it) => it.skipped || (it.sets.length > 0 && it.sets.every((s) => s.done));

  // ---------------------------------------------------------------- render
  function render() {
    tabsEl.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
    let html = '';
    if (ui.tab === 'train') {
      if (D.active) html = workoutView();
      else if (ui.summary) html = summaryView();
      else if (ui.step === 'plan') html = planView();
      else html = groupsView();
    } else if (ui.tab === 'progress') html = progressView();
    else html = historyView();
    if (ui.picker) html += pickerView();
    if (ui.explain) html += explainView();
    app.innerHTML = html;
    document.body.classList.toggle('has-sheet', !!(ui.picker || ui.explain));

    app.querySelectorAll('[data-fig]').forEach((el, i) => {
      Figure.mount(el, getEx(el.dataset.fig), { static: el.dataset.static === '1', u: 1, offset: i * 450 });
    });
    if (ui.tab === 'progress') drawCharts();
    tickClock();
    if (ui.justFinishedLift) {
      ui.justFinishedLift = false;
      const n = document.getElementById('next-cta');
      if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function groupsView() {
    const today = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const thumbs = { chest: 'bench-press', back: 'lat-pulldown', shoulders: 'lateral-raise', biceps: 'db-curl', triceps: 'tricep-pushdown', legs: 'back-squat', core: 'crunch' };
    return `
      <header class="top"><p class="eyebrow">${esc(today)}</p><h1>What are we training?</h1>
      <p class="sub">Pick one muscle group, or a few for a combined day. <span class="g-key"><i></i>Green</span> groups have had time to recover.</p></header>
      ${backupBanner()}
      <div class="group-grid">
        ${GROUPS.map((g) => {
          const n = ui.groups.indexOf(g.id);
          const rc = recovery(g.id);
          return `<button class="group g-${rc.state}${n >= 0 ? ' on' : ''}" data-act="toggle-group" data-id="${g.id}" aria-pressed="${n >= 0}">
            <span class="g-fig" data-fig="${thumbs[g.id]}" data-static="1"></span>
            <span class="g-name">${g.name}</span>
            <span class="g-status">${rc.state === 'ready' ? '●' : '◔'} ${esc(rc.label)}</span>
            <span class="g-meta">${esc(rc.meta)}</span>
            ${n >= 0 ? `<span class="g-check" aria-hidden="true">✓</span>` : ''}
          </button>`;
        }).join('')}
      </div>
      ${gearCard()}
      <div class="cta-bar"><button class="btn primary block" data-act="build" ${ui.groups.length ? '' : 'disabled'}>
        ${ui.groups.length ? `Build ${esc(ui.groups.map(groupName).join(' + '))} workout` : 'Select a muscle group'}</button></div>`;
  }

  function planView() {
    return `
      <header class="top row"><button class="icon-btn" data-act="back-groups" aria-label="Back">‹</button>
        <div><p class="eyebrow">${esc(ui.groups.map(groupName).join(' + '))}</p><h1>Today's lifts</h1></div></header>
      <p class="sub pad">No equipment for a lift? Tap <b>Swap</b> for one that works the same muscles with different gear. Tap again for the next option, or <b>Choose</b> to pick anything.</p>
      <div class="lift-list">
        ${ui.plan.map((id, i) => {
          const ex = getEx(id);
          const last = lastLine(id);
          return `<article class="lift-card">
            <div class="lc-side"><div class="thumb" data-fig="${esc(id)}"></div>
              <div class="lc-map">${Muscles.map(Muscles.of(ex), { mini: true })}</div></div>
            <div class="lc-body">
              <h3>${esc(ex.name)}</h3>
              <p class="meta">${esc(ex.equip || 'Custom')} · ${ex.sets || 3} × ${esc(ex.reps || '8–12')}</p>
              <p class="works">${esc(worksText(ex))}</p>
              ${last ? `<p class="last"><span>Last</span> ${esc(last)}</p>` : `<p class="last new">New lift${(() => { const e = startWeight(id); return e && e.w ? ` · try ~${fmtNum(e.w)} ${unit()}` : ''; })()}</p>`}
              <div class="lc-actions">
                <button class="chip" data-act="explain" data-id="${esc(id)}" title="Best practice for this lift">ⓘ Explain</button>
                <button class="chip" data-act="plan-swap" data-i="${i}" title="Swap for a similar lift">⇄ Swap</button>
                <button class="chip" data-act="open-picker" data-mode="plan-replace" data-i="${i}">Choose…</button>
                <button class="chip ghost" data-act="plan-remove" data-i="${i}" aria-label="Remove ${esc(ex.name)}" title="Remove">✕</button>
              </div>
            </div>
          </article>`;
        }).join('') || '<p class="empty">No lifts yet. Add one below.</p>'}
      </div>
      <button class="btn ghost block add" data-act="open-picker" data-mode="plan-add">+ Add another exercise</button>
      ${ui.plan.length ? `<p class="time-est"><span aria-hidden="true">⏱</span> About <b>${durText(planSecs(ui.plan))}</b>, counting ${D.rest ? `${D.rest < 60 ? `${D.rest} s` : `${(D.rest / 60).toString().replace('.5', ':30')} min`} rest between sets` : 'about 90 s rest between sets'} and warm-up sets.</p>` : ''}
      ${coverageCard(ui.plan, ui.groups)}
      <div class="cta-bar"><button class="btn primary block" data-act="start" ${ui.plan.length ? '' : 'disabled'}>Start workout · ${ui.plan.length} lifts${ui.plan.length ? ` · ~${durText(planSecs(ui.plan))}` : ''}</button></div>`;
  }

  function workoutView() {
    const A = D.active;
    const it = A.items[A.idx];
    const ex = getEx(it.exId);
    const last = Store.lastEntry(D, it.exId);
    const done = itemDone(it);
    const nextIdx = A.items.findIndex((x, i) => i !== A.idx && !itemDone(x));
    const allDone = A.items.every(itemDone);
    const doneCount = A.items.filter(itemDone).length;
    const wLabel = ex.bw ? `+${unit()}` : unit();
    const rLabel = ex.timed ? 'Sec' : 'Reps';
    const est = last ? null : startWeight(ex.id);
    // on a new lift, the last finished set tells us what the next one should be
    const lastDone = [...it.sets].reverse().find((x) => x.done);
    const cal = !last && !ex.bw && !ex.timed && lastDone ? calibrate(ex, lastDone) : null;

    const rows = it.sets.map((s, i) => {
      const prev = last && (last.sets[i] || last.sets[last.sets.length - 1]);
      const above = it.sets[i - 1];
      const phW = prev ? fmtNum(prev.w) : cal && !s.done ? fmtNum(cal.w)
        : above && above.w !== '' ? above.w : ex.bw ? '0' : est && est.w ? fmtNum(est.w) : '';
      const phR = prev ? prev.r : above && above.r !== '' ? above.r : repTarget(ex);
      return `<div class="set-row${s.done ? ' done' : ''}">
        <span class="set-n">${i + 1}</span>
        <span class="prev">${prev ? esc(setStr(prev, ex)) : '—'}</span>
        <input type="number" inputmode="decimal" step="any" min="0" aria-label="Set ${i + 1} weight" data-set="${i}" data-k="w" value="${esc(s.w)}" placeholder="${esc(phW)}" ${s.done ? 'readonly' : ''}>
        <input type="number" inputmode="numeric" step="1" min="0" aria-label="Set ${i + 1} ${rLabel.toLowerCase()}" data-set="${i}" data-k="r" value="${esc(s.r)}" placeholder="${esc(phR)}" ${s.done ? 'readonly' : ''}>
        <button class="check" data-act="toggle-set" data-s="${i}" aria-pressed="${s.done}" aria-label="${s.done ? 'Undo' : 'Complete'} set ${i + 1}">✓</button>
      </div>`;
    }).join('');

    let cta;
    if (allDone) cta = `<button id="next-cta" class="btn primary block" data-act="finish">Finish workout</button>`;
    else if (done && nextIdx >= 0) cta = `<button id="next-cta" class="btn primary block" data-act="goto" data-i="${nextIdx}">Next: ${esc(getEx(A.items[nextIdx].exId).name)} →</button>`;
    else if (it.sets.some((s) => s.done)) cta = `<div class="split">
        <button class="btn ghost" data-act="wo-skip">Skip remaining sets</button>
        <button class="btn ghost" data-act="open-picker" data-mode="wo-add">+ Add a lift</button></div>`;
    else cta = `<div class="split">
        <button class="btn ghost" data-act="wo-swap" title="Swap for a lift that works the same muscles">⇄ Swap lift</button>
        <button class="btn ghost" data-act="open-picker" data-mode="wo-replace">Choose another</button></div>
        <button class="link muted-link" data-act="wo-skip">Skip this lift</button>`;

    return `
      <header class="top row wo-head">
        <div><p class="eyebrow">${esc((A.groups || []).map(groupName).join(' + ') || 'Workout')} · <span data-elapsed></span>${allDone ? '' : ` · ~${durText(woLeftSecs(A))} left`}</p>
        <h1>Lift ${A.idx + 1} of ${A.items.length}</h1></div>
        <button class="btn small" data-act="finish">Finish</button>
      </header>
      <ol class="dots" aria-label="Workout progress">
        ${A.items.map((x, i) => `<li><button data-act="goto" data-i="${i}" class="dot${i === A.idx ? ' cur' : ''}${itemDone(x) ? (x.skipped ? ' skip' : ' ok') : ''}" aria-label="${esc(getEx(x.exId).name)}${itemDone(x) ? ' (done)' : ''}"></button></li>`).join('')}
      </ol>

      <section class="card ex-card">
        <div class="ex-fig" data-fig="${esc(ex.id)}"></div>
        <div class="ex-info">
          <h2>${esc(ex.name)}</h2>
          <p class="meta">${esc(ex.equip || 'Custom')} · Target ${ex.sets || 3} × ${esc(ex.reps || '8–12')}</p>
          <button class="chip small xp-btn" data-act="explain" data-id="${esc(ex.id)}">ⓘ Explain this lift</button>
          <div class="ex-map">${Muscles.map(Muscles.of(ex))}</div>
          <p class="works">${Muscles.list(Muscles.of(ex)).slice(0, 4).map((a, i) => i ? esc(Muscles.AREAS[a]) : `<b>${esc(Muscles.AREAS[a])}</b>`).join(' · ')}</p>
        </div>
        ${ex.cues && ex.cues.length ? `<details class="howto" ${last ? '' : 'open'}><summary>How to do it</summary><ol>${ex.cues.map((c) => `<li>${esc(c)}</li>`).join('')}</ol></details>` : ''}
      </section>

      <section class="card">
        ${last ? `<div class="lasttime"><span class="lt-label">Last time · ${esc(agoText(last.date))}</span><span class="lt-sets">${last.sets.map((s) => `<b>${esc(setStr(s, ex))}</b>`).join('')}</span></div>`
               : `<div class="lasttime new"><p class="lt-label">${startText(est, ex)}</p>${est && est.from && est.from !== 'lifts' && !it.sets.some((x) => x.done) ? profileForm() : ''}</div>`}
        ${cal && !done ? `<p class="cal">Next set: <b>${fmtNum(cal.w)} ${unit()}</b> · ${esc(cal.why)}</p>` : ''}
        <div class="sets">
          <div class="set-head"><span>Set</span><span>Previous</span><span>${esc(wLabel)}</span><span>${rLabel}</span><span></span></div>
          ${rows}
        </div>
        <div class="set-tools">
          <button class="link" data-act="add-set">+ Add set</button>
          ${it.sets.length > 1 ? `<button class="link" data-act="remove-set">− Remove set</button>` : ''}
        </div>
        ${ui.rest ? `<div class="rest" id="rest"><span>Rest</span><b id="rest-t">0:00</b><div class="rest-bar"><i id="rest-bar"></i></div><button class="link" data-act="rest-add">+30s</button><button class="link" data-act="rest-skip">Skip</button></div>` : ''}
      </section>

      <div class="wo-cta">${cta}</div>

      <section class="card upnext">
        <h3>Today's lifts <span class="muted">${doneCount}/${A.items.length}</span></h3>
        <ul>${A.items.map((x, i) => {
          const e = getEx(x.exId);
          const n = x.sets.filter((s) => s.done).length;
          const state = x.skipped ? 'Skipped' : itemDone(x) ? 'Done' : n ? `${n}/${x.sets.length} sets` : `${x.sets.length} sets`;
          return `<li class="${i === A.idx ? 'cur' : ''}"><button data-act="goto" data-i="${i}"><span>${esc(e.name)}</span><span class="muted">${state}</span></button></li>`;
        }).join('')}</ul>
        <button class="link" data-act="open-picker" data-mode="wo-add">+ Add exercise</button>
        <button class="link danger" data-act="discard">Discard workout</button>
      </section>`;
  }

  function summaryView() {
    const s = ui.summary;
    return `
      <header class="top"><p class="eyebrow">Workout complete</p><h1>Nice work.</h1></header>
      <div class="tiles">
        <div class="tile"><span>Time</span><b>${s.duration} min</b></div>
        <div class="tile"><span>Sets</span><b>${s.sets}</b></div>
        <div class="tile"><span>Volume</span><b>${Charts.num(s.volume)} ${unit()}</b></div>
      </div>
      ${s.prs.length ? `<section class="card pr"><h2>New personal bests</h2><ul>${s.prs.map((p) => `<li><b>${esc(p.name)}</b><span>Est. 1RM ${fmtNum(Math.round(p.now))} ${unit()} <em>(was ${fmtNum(Math.round(p.was))})</em></span></li>`).join('')}</ul></section>` : ''}
      ${backupBanner()}
      <section class="card"><h2>What you did</h2><ul class="hist-sets">${s.entries.map((e) => `<li><b>${esc(e.name)}</b><span>${e.sets.map((x) => esc(setStr(x, getEx(e.exId)))).join(', ')}</span></li>`).join('')}</ul></section>
      <div class="cta-bar"><button class="btn primary block" data-act="summary-done">Done</button>
      <button class="btn ghost block" data-act="tab" data-tab="progress">See progress</button></div>`;
  }

  // -------------------------------------------------------------- progress
  function weekStart(d) {
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function loggedExercises() {
    const ids = [];
    [...D.sessions].sort(Store.byDate).reverse().forEach((s) => s.entries.forEach((e) => { if (!ids.includes(e.exId)) ids.push(e.exId); }));
    return ids;
  }

  function metricsFor(exId) {
    const s = Store.series(D, exId);
    const bw = s.length && s.every((p) => p.top === 0);
    return bw ? [['reps', getEx(exId).timed ? 'Longest hold' : 'Most reps'], ['totalReps', getEx(exId).timed ? 'Total time' : 'Total reps']]
              : [['e1rm', 'Est. 1RM'], ['top', 'Heaviest set'], ['vol', 'Volume']];
  }

  function progressView() {
    if (!D.sessions.length) {
      return `<header class="top"><h1>Progress</h1></header>
        <section class="card empty-state"><h2>No workouts yet</h2><p>Finish a workout and your lifts will show up here as charts.</p>
        <button class="btn ghost" data-act="sample">Load sample data to preview</button></section>`;
    }
    const now = new Date();
    const wk = weekStart(now);
    const thisWeek = D.sessions.filter((s) => new Date(s.date) >= wk).length;
    const d30 = new Date(now - 30 * 864e5);
    const vol30 = D.sessions.filter((s) => new Date(s.date) >= d30).reduce((t, s) => t + Store.sessionVolume(s), 0);
    const ids = loggedExercises();
    if (!ui.progEx || !ids.includes(ui.progEx)) ui.progEx = ids[0];
    const mets = metricsFor(ui.progEx);
    if (!mets.some((m) => m[0] === ui.metric)) ui.metric = mets[0][0];
    const series = Store.series(D, ui.progEx);
    const ex = getEx(ui.progEx);
    const first = series[0], lastP = series[series.length - 1];
    const delta = series.length > 1 ? lastP[ui.metric] - first[ui.metric] : 0;

    return `
      <header class="top"><h1>Progress</h1></header>
      <div class="tiles">
        <div class="tile"><span>Workouts</span><b>${D.sessions.length}</b></div>
        <div class="tile"><span>This week</span><b>${thisWeek}</b></div>
        <div class="tile"><span title="Total weight lifted, last 30 days">30-day lb</span><b>${Charts.num(vol30)}</b></div>
      </div>

      <section class="card">
        <div class="card-head"><div><h2>${esc(ex.name)}</h2>
          <p class="sub">${series.length} session${series.length === 1 ? '' : 's'}${series.length > 1 ? ` · <span class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(Math.round(delta * 10) / 10))}${ui.metric === 'totalReps' || ui.metric === 'reps' ? '' : ' ' + unit()}</span> since ${shortDate(first.date)}` : ''}</p></div>
        </div>
        <label class="field"><span class="sr">Exercise</span>
          <select id="prog-ex">${ids.map((id) => `<option value="${esc(id)}" ${id === ui.progEx ? 'selected' : ''}>${esc(getEx(id).name)}</option>`).join('')}</select></label>
        <div class="seg" role="tablist">${mets.map(([k, l]) => `<button role="tab" aria-selected="${k === ui.metric}" data-act="metric" data-m="${k}">${l}</button>`).join('')}</div>
        <div id="ch-ex" class="chart"></div>
        <p class="note">${ui.metric === 'e1rm' ? 'Estimated one-rep max from your best set each session (weight × (1 + reps ÷ 30)).' : ui.metric === 'vol' ? 'Weight × reps, added up across all sets in the session.' : ui.metric === 'top' ? 'The heaviest weight you used that session.' : ''}</p>
        <details class="table-view"><summary>Show as table</summary>
          <table><thead><tr><th>Date</th><th>Sets</th><th>${esc(mets.find((m) => m[0] === ui.metric)[1])}</th></tr></thead>
          <tbody>${[...series].reverse().map((p) => `<tr><td>${shortDate(p.date)}</td><td>${p.sets.map((s) => esc(setStr(s, ex))).join(', ')}</td><td>${fmtNum(Math.round(p[ui.metric] * 10) / 10)}</td></tr>`).join('')}</tbody></table>
        </details>
      </section>

      <section class="card">
        <h2>Weekly volume</h2>
        <p class="sub">Total weight lifted (weight × reps) per week, last 12 weeks</p>
        <div id="ch-week" class="chart"></div>
      </section>`;
  }

  function drawCharts() {
    const exEl = document.getElementById('ch-ex');
    if (exEl) {
      const series = Store.series(D, ui.progEx);
      const isReps = ui.metric === 'reps' || ui.metric === 'totalReps';
      const ex = getEx(ui.progEx);
      Charts.line(exEl, series.map((p) => ({ x: p.date, y: Math.round(p[ui.metric] * 10) / 10, note: p.sets.map((s) => setStr(s, ex)).join(', ') })),
        { unit: isReps ? (ex.timed ? 's' : 'reps') : unit(), label: `${ex.name} progress` });
    }
    const wkEl = document.getElementById('ch-week');
    if (wkEl) {
      const start = weekStart(new Date());
      const weeks = [];
      for (let i = 11; i >= 0; i--) { const d = new Date(start); d.setDate(d.getDate() - i * 7); weeks.push({ d, y: 0, n: 0 }); }
      D.sessions.forEach((s) => {
        const ws = +weekStart(new Date(s.date));
        const w = weeks.find((x) => +x.d === ws);
        if (w) { w.y += Store.sessionVolume(s); w.n++; }
      });
      Charts.bars(wkEl, weeks.map((w) => ({ y: Math.round(w.y), label: Charts.dlabel(w.d), tip: `Week of ${Charts.dlabel(w.d)} · ${w.n} workout${w.n === 1 ? '' : 's'}` })),
        { unit: unit(), label: 'Weekly volume', empty: 'No workouts in the last 12 weeks' });
    }
  }

  // --------------------------------------------------------------- history
  function historyView() {
    const list = [...D.sessions].sort(Store.byDate).reverse();
    return `
      <header class="top"><h1>History</h1></header>
      ${list.length ? `<ul class="hist">${list.map((s) => {
        const open = ui.open[s.id];
        return `<li class="card hist-item">
          <button class="hist-head" data-act="hist-toggle" data-id="${s.id}" aria-expanded="${!!open}">
            <span><b>${esc(new Date(s.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }))}</b>
            <span class="muted">${esc((s.groups || []).map(groupName).join(' + '))}</span></span>
            <span class="muted">${s.entries.length} lifts · ${Charts.num(Store.sessionVolume(s))} ${unit()}</span>
          </button>
          ${open ? `<ul class="hist-sets">${s.entries.map((e) => `<li><b>${esc(e.name)}</b><span>${e.sets.map((x) => esc(setStr(x, getEx(e.exId)))).join(', ')}</span></li>`).join('')}</ul>
            <button class="link danger" data-act="hist-delete" data-id="${s.id}">Delete this workout</button>` : ''}
        </li>`;
      }).join('')}</ul>` : `<section class="card empty-state"><h2>Nothing logged yet</h2><p>Your finished workouts will be listed here.</p></section>`}

      ${safetyCard()}
      <section class="card settings">
        <h2>Settings</h2>
        <label class="field row"><span>Weight units</span>
          <select id="set-units"><option value="lb" ${D.units === 'lb' ? 'selected' : ''}>Pounds (lb)</option><option value="kg" ${D.units === 'kg' ? 'selected' : ''}>Kilograms (kg)</option></select></label>
        <label class="field row"><span>Rest timer</span>
          <select id="set-rest">${[0, 45, 60, 90, 120, 180].map((n) => `<option value="${n}" ${D.rest === n ? 'selected' : ''}>${n ? (n < 60 ? `${n} sec` : `${n / 60} min`).replace('1.5 min', '1:30') : 'Off'}</option>`).join('')}</select></label>
        <label class="field row"><span>Bodyweight</span>
          <input id="set-bw" type="number" inputmode="decimal" min="0" step="any" value="${D.profile && D.profile.bw ? fmtNum(Math.round(profileBw())) : ''}" placeholder="${unit()}"></label>
        <label class="field row"><span>Lifting experience</span>
          <select id="set-exp">${Object.keys(EXP).map((k) => `<option value="${k}" ${((D.profile || {}).exp || 'new') === k ? 'selected' : ''}>${EXP[k].name}</option>`).join('')}</select></label>
        <p class="note">Bodyweight and experience are only used to suggest a starting weight for lifts you haven't logged yet.</p>
        <div class="btn-row">
          ${D.sessions.length ? '' : '<button class="btn ghost small" data-act="sample">Load sample data</button>'}
          <button class="btn ghost small danger" data-act="reset">Erase all data</button>
        </div>
      </section>`;
  }

  // ---------------------------------------------------------------- picker
  function pickerView() {
    const p = ui.picker;
    return `<div class="sheet-backdrop" data-act="close-picker-bg">
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pk-title">
        <header class="sheet-head"><h2 id="pk-title">${p.mode.endsWith('add') ? 'Add an exercise' : 'Pick a replacement'}</h2>
          <button class="icon-btn" data-act="close-picker" aria-label="Close">✕</button></header>
        <input type="search" id="pk-q" placeholder="Search exercises" value="${esc(p.q || '')}" autocomplete="off">
        <div class="chips-row">
          <button class="chip${!p.g ? ' on' : ''}" data-act="pk-group" data-g="">All</button>
          ${GROUPS.map((g) => `<button class="chip${p.g === g.id ? ' on' : ''}" data-act="pk-group" data-g="${g.id}">${g.name}</button>`).join('')}
        </div>
        <ul class="pk-list" id="pk-list">${pickerList()}</ul>
        <details class="custom"><summary>Create your own exercise</summary>
          <form id="pk-custom" class="custom-form">
            <label class="field"><span>Name</span><input name="name" required maxlength="60" placeholder="e.g. Landmine Press"></label>
            <label class="field"><span>Muscle group</span><select name="group">${GROUPS.map((g) => `<option value="${g.id}" ${(p.g || ui.groups[0] || (D.active && D.active.groups[0])) === g.id ? 'selected' : ''}>${g.name}</option>`).join('')}</select></label>
            <label class="field"><span>Equipment</span><select name="equip">${['Barbell', 'Dumbbell', 'Cable', 'Machine', 'Bodyweight', 'Other'].map((e) => `<option>${e}</option>`).join('')}</select></label>
            <button class="btn primary block" type="submit">Create and add</button>
          </form>
        </details>
      </div></div>`;
  }

  function pickerList() {
    const p = ui.picker;
    const q = (p.q || '').trim().toLowerCase();
    const plan = p.mode.startsWith('plan');
    const taken = plan ? ui.plan : D.active ? D.active.items.map((x) => x.exId) : [];
    // gaps = areas of today's groups that the other lifts don't fully work yet
    const groups = (plan ? ui.groups : D.active && D.active.groups) || [];
    const replacing = p.mode.endsWith('replace') ? (plan ? ui.plan[p.i] : D.active && D.active.items[D.active.idx].exId) : null;
    const cur = Muscles.total(taken.filter((id) => id !== replacing).map(getEx));
    const gapAreas = areasFor(groups).filter((a) => (cur[a] || 0) < 1);
    const fills = (e) => gapAreas.filter((a) => (Muscles.of(e)[a] || 0) >= .5 && (Muscles.of(e)[a] || 0) > (cur[a] || 0));
    let list = allEx().filter((e) => (!p.g || e.groups.includes(p.g)) && (!q || e.name.toLowerCase().includes(q) || (e.equip || '').toLowerCase().includes(q)));
    if (!list.length) return `<li class="empty">No matches. Create your own below.</li>`;
    list = list.map((e) => ({ e, f: canDo(e) ? fills(e) : [], t: taken.includes(e.id), no: !canDo(e) }));
    list.sort((x, y) => (x.t - y.t) || (x.no - y.no) || (y.f.length ? 1 : 0) - (x.f.length ? 1 : 0));
    const head = gapAreas.length && !q ? `<li class="pk-note">Not fully worked yet: <b>${esc(gapAreas.map((a) => Muscles.AREAS[a]).join(', '))}</b>. Lifts that help are listed first.</li>` : '';
    const firstNo = list.findIndex((x) => x.no && !x.t);
    return head + list.map(({ e, f, t, no }, i) => `${i === firstNo ? `<li class="pk-note">Needs equipment you didn't select today</li>` : ''}<li${no ? ' class="pk-no"' : ''}><button data-act="pick" data-id="${esc(e.id)}" ${t ? 'disabled' : ''}>
      <span class="pk-fig" data-fig="${esc(e.id)}" data-static="1"></span>
      <span class="pk-txt"><b>${esc(e.name)}</b><span class="muted">${esc(e.equip || 'Custom')} · ${esc(worksText(e, 2) || e.groups.map(groupName).join(', '))}${t ? ' · already added' : no ? ` · needs ${esc(GEAR[gearOf(e)].name.toLowerCase())}` : ''}</span>
      ${f.length && !t ? `<span class="pk-fill">Fills gap: ${esc(f.map((a) => Muscles.AREAS[a]).join(', '))}</span>` : ''}</span>
      <span class="pk-map">${Muscles.map(Muscles.of(e), { mini: true })}</span></button></li>`).join('');
  }

  function applyPick(id) {
    const p = ui.picker;
    if (p.mode === 'plan-add') ui.plan.push(id);
    else if (p.mode === 'plan-replace') { const from = ui.plan[p.i]; ui.plan[p.i] = id; if (from && from !== id) planSwapped(p.i, from, id, 'Replaced with'); }
    else if (p.mode === 'wo-add') { D.active.items.push(newItem(id)); save(); toast(`${getEx(id).name} added`); }
    else if (p.mode === 'wo-replace') { const A = D.active, old = A.items[A.idx], it = newItem(id); A.items[A.idx] = it; ui.rest = null; save(); if (old.exId !== id) woSwapped(A.idx, old, it, 'Replaced with'); }
    ui.picker = null;
    render();
  }

  // --------------------------------------------------------------- actions
  function currentItem() { return D.active.items[D.active.idx]; }

  function startRest() {
    if (!D.rest) return;
    ui.rest = { end: Date.now() + D.rest * 1000, total: D.rest * 1000 };
  }

  const actions = {
    tab(b) { ui.tab = b.dataset.tab; if (ui.tab === 'train' && ui.summary && b.closest('#tabs')) ui.summary = null; ui.picker = null; render(); window.scrollTo(0, 0); },
    'toggle-group'(b) {
      const id = b.dataset.id;
      const i = ui.groups.indexOf(id);
      if (i >= 0) ui.groups.splice(i, 1); else ui.groups.push(id);
      render();
    },
    'toggle-gear'(b) {
      const k = b.dataset.k;
      D.gear = { ...gear(), [k]: !gear()[k] };
      save(); render();
    },
    build() { ui.plan = buildPlan(ui.groups); ui.step = 'plan'; render(); window.scrollTo(0, 0); },
    'back-groups'() { ui.step = 'groups'; render(); },
    'plan-swap'(b) {
      const i = +b.dataset.i;
      const from = ui.plan[i];
      const alt = nextAlt(from, ui.plan);
      if (!alt) { ui.picker = { mode: 'plan-replace', i, g: ui.groups[0] }; render(); return; }
      ui.plan[i] = alt;
      planSwapped(i, from, alt);
      render();
    },
    'plan-remove'(b) { ui.plan.splice(+b.dataset.i, 1); render(); },
    'cov-add'(b) { const id = b.dataset.id; if (!ui.plan.includes(id)) ui.plan.push(id); toast(`${getEx(id).name} added`); render(); },
    'open-picker'(b) {
      const groups = b.dataset.mode.startsWith('wo') ? D.active.groups : ui.groups;
      ui.picker = { mode: b.dataset.mode, i: +b.dataset.i, g: groups && groups.length === 1 ? groups[0] : '', q: '' };
      render();
      const q = document.getElementById('pk-q'); if (q && matchMedia('(pointer:fine)').matches) q.focus();
    },
    'close-picker'() { ui.picker = null; render(); },
    explain(b) { ui.explain = b.dataset.id; render(); },
    'close-explain'() { ui.explain = null; render(); },
    'close-explain-bg'(b, e) { if (e.target === b) { ui.explain = null; render(); } },
    'close-picker-bg'(b, e) { if (e.target === b) { ui.picker = null; render(); } },
    'pk-group'(b) { ui.picker.g = b.dataset.g; render(); },
    pick(b) { applyPick(b.dataset.id); },
    start() {
      D.active = { startedAt: Date.now(), groups: [...ui.groups], idx: 0, items: ui.plan.map(newItem) };
      ui.rest = null;
      save(); render(); window.scrollTo(0, 0);
    },
    goto(b) { D.active.idx = +b.dataset.i; ui.rest = null; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    'toggle-set'(b) {
      const it = currentItem();
      const i = +b.dataset.s;
      const s = it.sets[i];
      if (s.done) { s.done = false; save(); render(); return; }
      const row = b.closest('.set-row');
      const wIn = row.querySelector('[data-k="w"]'), rIn = row.querySelector('[data-k="r"]');
      if (s.w === '') s.w = wIn.placeholder || '';
      if (s.r === '') s.r = rIn.placeholder || '';
      if (s.r === '' || !(+s.r > 0)) { s.r = ''; rIn.focus(); rIn.classList.add('shake'); setTimeout(() => rIn.classList.remove('shake'), 400); return; }
      if (s.w === '') s.w = '0';
      s.done = true;
      const finishedLift = itemDone(it);
      if (!(finishedLift && D.active.items.every(itemDone))) startRest();
      if (finishedLift) { ui.justFinishedLift = true; toast(`${getEx(it.exId).name} done`); }
      save(); render();
    },
    'add-set'() {
      const it = currentItem();
      it.sets.push({ w: '', r: '', done: false });
      save(); render();
    },
    'remove-set'() {
      const it = currentItem();
      const i = it.sets.map((s) => s.done).lastIndexOf(false);
      it.sets.splice(i >= 0 ? i : it.sets.length - 1, 1);
      save(); render();
    },
    'wo-swap'() {
      const A = D.active;
      const from = currentItem().exId;
      const alt = nextAlt(from, A.items.map((x) => x.exId));
      if (!alt) { toast('No similar lift left. Try Choose another.'); return; }
      const old = A.items[A.idx];
      const it = newItem(alt);
      A.items[A.idx] = it;
      ui.rest = null;
      woSwapped(A.idx, old, it);
      save(); render();
    },
    'wo-skip'() {
      const A = D.active;
      currentItem().skipped = true; // keeps any sets already done
      const n = A.items.findIndex((x) => !itemDone(x));
      if (n >= 0) A.idx = n;
      ui.rest = null;
      save(); render();
    },
    'rest-add'() { if (ui.rest) { ui.rest.end += 30000; ui.rest.total += 30000; } tickClock(); },
    'rest-skip'() { ui.rest = null; const r = document.getElementById('rest'); if (r) r.remove(); },
    finish() {
      const A = D.active;
      const pending = A.items.some((it) => !it.skipped && it.sets.some((s) => !s.done) && it.sets.some((s) => s.done));
      const untouched = A.items.filter((it) => !it.sets.some((s) => s.done) && !it.skipped).length;
      if (!A.items.every(itemDone)) {
        const msg = pending || untouched ? 'Finish now? Sets you haven\'t checked off won\'t be saved.' : 'Finish workout?';
        if (!confirm(msg)) return;
      }
      const entries = A.items.map((it) => ({ exId: it.exId, name: getEx(it.exId).name, sets: it.sets.filter((s) => s.done).map((s) => ({ w: +s.w || 0, r: +s.r || 0 })) })).filter((e) => e.sets.length);
      if (!entries.length) {
        if (confirm('No sets were checked off, so there is nothing to save. Discard this workout?')) { D.active = null; ui.rest = null; save(); ui.step = 'groups'; render(); }
        return;
      }
      const date = new Date(A.startedAt).toISOString();
      const prs = [];
      entries.forEach((e) => {
        const was = Store.bestE1rm(D, e.exId);
        const now = Store.summarize(e.sets).e1rm;
        if (was > 0 && now > was) prs.push({ name: e.name, was, now });
      });
      const session = { id: uid(), date, groups: A.groups, durationMin: Math.max(1, Math.round((Date.now() - A.startedAt) / 60000)), entries };
      D.sessions.push(session);
      askPersist();
      D.active = null;
      ui.rest = null;
      ui.summary = { duration: session.durationMin, sets: entries.reduce((t, e) => t + e.sets.length, 0), volume: Store.sessionVolume(session), prs, entries };
      ui.step = 'groups'; ui.groups = []; ui.plan = [];
      save(); render(); window.scrollTo(0, 0);
    },
    discard() {
      if (!confirm('Discard this workout? Nothing from it will be saved.')) return;
      D.active = null; ui.rest = null; ui.step = 'plan'; save(); render();
    },
    'summary-done'() { ui.summary = null; render(); window.scrollTo(0, 0); },
    metric(b) { ui.metric = b.dataset.m; render(); },
    'hist-toggle'(b) { ui.open[b.dataset.id] = !ui.open[b.dataset.id]; render(); },
    'hist-delete'(b) {
      if (!confirm('Delete this workout from your history? This can\'t be undone.')) return;
      D.sessions = D.sessions.filter((s) => s.id !== b.dataset.id); save(); render();
    },
    export() {
      const name = `liftlog-backup-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([JSON.stringify({ ...D, active: null }, null, 2)], { type: 'application/json' });
      const done = () => { D.lastBackup = new Date().toISOString(); D.backupSnooze = 0; save(); toast('Backup saved'); render(); };
      const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
      // phones: open the share sheet (Save to Files, Drive, email...). Computers: download.
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) {
        navigator.share({ files: [file], title: 'LiftLog backup' }).then(done).catch((err) => { if (err && err.name !== 'AbortError') toast('Couldn\'t open the share sheet'); });
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      done();
    },
    'backup-later'() { D.backupSnooze = Date.now() + 3 * 864e5; save(); render(); },
    install() {
      if (!safe.installEvt) return;
      safe.installEvt.prompt();
      safe.installEvt.userChoice.finally(() => { safe.installEvt = null; render(); });
    },
    persist() {
      if (!navigator.storage || !navigator.storage.persist) { toast('This browser doesn\'t support that'); return; }
      navigator.storage.persist().then((v) => { safe.persisted = v; toast(v ? 'Storage protected' : 'The browser said no. Installing the app usually helps.'); render(); });
    },
    reset() {
      if (!confirm('Erase ALL workouts, custom exercises and settings from this browser? This can\'t be undone.')) return;
      localStorage.removeItem('liftlog.v1'); D = Store.load(); ui.summary = null; ui.step = 'groups'; render();
    },
    sample() { loadSample(); toast('Sample data loaded'); render(); },
  };

  // ------------------------------------------------------------ sample data
  function loadSample() {
    const rot = [
      ['chest', [['bench-press', 135, 8], ['incline-db-press', 45, 10], ['cable-fly', 30, 12], ['push-up', 0, 15]]],
      ['back', [['lat-pulldown', 110, 10], ['barbell-row', 115, 8], ['db-row', 50, 10], ['face-pull', 35, 12]]],
      ['legs', [['back-squat', 165, 6], ['rdl', 135, 8], ['leg-press', 250, 10], ['calf-raise', 40, 15]]],
      ['shoulders', [['ohp', 85, 6], ['lateral-raise', 15, 12], ['db-curl', 25, 10], ['tricep-pushdown', 45, 12]]],
    ];
    const days = [];
    const today = new Date();
    for (let d = 70; d >= 2; d--) {
      const dt = new Date(today); dt.setDate(dt.getDate() - d);
      if ([1, 3, 5].includes(dt.getDay()) || (dt.getDay() === 6 && d % 3 === 0)) days.push(dt);
    }
    days.forEach((dt, n) => {
      const [g, lifts] = rot[n % rot.length];
      const cycle = Math.floor(n / rot.length);
      dt.setHours(17, 30, 0, 0);
      D.sessions.push({
        id: uid(), date: dt.toISOString(), groups: [g], durationMin: 50 + (n % 4) * 5,
        entries: lifts.map(([id, w, r]) => {
          const ex = getEx(id);
          const step = w >= 100 ? 5 : w >= 40 ? 2.5 : w > 0 ? 1.25 : 0;
          const base = w + Math.floor(cycle * 0.8) * step * (w >= 100 ? 1 : 1);
          return { exId: id, name: ex.name, sets: [0, 1, 2].map((k) => ({ w: Math.round(base / 2.5) * 2.5 || 0, r: Math.max(1, r + (w ? 0 : cycle) - (k === 2 ? (n % 2) : 0) - (k && n % 3 === 0 ? 1 : 0)) })) };
        }),
      });
    });
    save();
  }

  // ------------------------------------------------------------- live clock
  function tickClock() {
    const el = document.querySelector('[data-elapsed]');
    if (el && D.active) {
      const m = Math.floor((Date.now() - D.active.startedAt) / 60000);
      el.textContent = m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
    }
    if (ui.rest) {
      const left = Math.max(0, ui.rest.end - Date.now());
      const t = document.getElementById('rest-t'), bar = document.getElementById('rest-bar'), box = document.getElementById('rest');
      if (t && left > 0) t.textContent = fmtClock(left);
      if (bar) bar.style.width = `${(left / ui.rest.total) * 100}%`;
      if (left === 0) {
        if (box) { box.classList.add('over'); t.textContent = 'Go!'; }
        if (!ui.rest.buzzed) { ui.rest.buzzed = true; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
        if (Date.now() - ui.rest.end > 8000) { ui.rest = null; if (box) box.remove(); }
      }
    }
  }
  const fmtClock = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  setInterval(tickClock, 250);

  // ---------------------------------------------------------------- events
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = actions[b.dataset.act];
    if (fn) fn(b, e);
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.k && D.active) {
      const s = currentItem().sets[+t.dataset.set];
      if (s && !s.done) { s[t.dataset.k] = t.value; save(); }
    } else if (t.id === 'pk-q') {
      ui.picker.q = t.value;
      const list = document.getElementById('pk-list');
      list.innerHTML = pickerList();
      list.querySelectorAll('[data-fig]').forEach((el) => Figure.mount(el, getEx(el.dataset.fig), { static: true, u: 1 }));
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (ui.explain) { ui.explain = null; render(); } else if (ui.picker) { ui.picker = null; render(); }
  });
  app.addEventListener('keydown', (e) => {
    // Enter in a reps box completes the set
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.k) {
      e.preventDefault();
      const btn = e.target.closest('.set-row').querySelector('.check');
      if (e.target.dataset.k === 'w') e.target.closest('.set-row').querySelector('[data-k="r"]').focus();
      else btn.click();
    }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'prog-ex') { ui.progEx = t.value; render(); }
    if (t.id === 'set-units') { D.units = t.value; save(); render(); }
    if (t.id === 'set-rest') { D.rest = +t.value; save(); }
    if (t.id === 'set-bw' || t.id === 'prof-bw') { D.profile = { ...(D.profile || {}), bw: +t.value || 0, unit: D.units }; save(); render(); }
    if (t.id === 'set-exp' || t.id === 'prof-exp') { D.profile = { ...(D.profile || {}), exp: t.value }; save(); render(); }
    if (t.id === 'import' && t.files[0]) {
      t.files[0].text().then((txt) => {
        try {
          const data = JSON.parse(txt);
          if (!Array.isArray(data.sessions)) throw new Error('bad file');
          if (!confirm(`Replace your current data with this backup (${data.sessions.length} workouts)?`)) return;
          D = Object.assign(Store.load(), data, { active: data.active || null });
          save(); toast('Backup imported'); render();
        } catch (err) { alert('That file doesn\'t look like a LiftLog backup.'); }
      });
    }
  });

  app.addEventListener('submit', (e) => {
    if (e.target.id !== 'pk-custom') return;
    e.preventDefault();
    const f = new FormData(e.target);
    const name = String(f.get('name') || '').trim();
    if (!name) return;
    const ex = { id: `custom-${uid()}`, name, groups: [f.get('group')], equip: f.get('equip'), bw: f.get('equip') === 'Bodyweight', sets: 3, reps: '8–12', cues: [], custom: true };
    D.custom.push(ex);
    save();
    applyPick(ex.id);
  });

  let rz;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.tab === 'progress') drawCharts(); }, 150); });

  if (isStandalone() && D.sessions.length) askPersist();
  render();
})();

</script>
